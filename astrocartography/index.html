<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natal Navigator</title>
    <meta name="apple-mobile-web-app-title" content="Natal Navigator" />
    <meta name="application-name" content="Natal Navigator" />
    <meta name="description" content="Discover your astrocartography lines — find where your planets align for career, love, and growth." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://kbwjxtvqdkcicaydtixp.supabase.co" />
    <link rel="dns-prefetch" href="https://kbwjxtvqdkcicaydtixp.supabase.co" />
    <!-- Preconnect to CDN for world-atlas (globe country borders) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <!-- Load fonts non-blocking: media trick prevents render-blocking; &display=swap ensures text visible immediately -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Instrument+Sans:wght@400;600;700&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <style>
      /* Inline critical CSS so loading screen shows instantly */
      html { overflow: hidden; height: 100%; }
      body { margin: 0; background: #0A1018; overflow: hidden; height: 100%; width: 100%; position: fixed; touch-action: pan-y; }
      #root-loader {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #0A1018;
      }
      #root-loader .title {
        font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700;
        color: #00D88A; letter-spacing: 5px; margin-bottom: 20px;
      }
      #root-loader .dots { display: flex; gap: 6px; }
      #root-loader .dot {
        width: 6px; height: 6px; border-radius: 50%; background: #00D88A;
        animation: rl-pulse 1.2s ease-in-out infinite;
      }
      #root-loader .dot:nth-child(2) { animation-delay: 0.2s; }
      #root-loader .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes rl-pulse {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1); }
      }
      /* Hide loader once React mounts */
      #root:not(:empty) + #root-loader { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Instant loading screen — visible before any JS loads/executes -->
    <div id="root-loader">
      <div class="title">NATAL NAVIGATOR</div>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
