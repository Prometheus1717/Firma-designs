<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-rd d-rd">
  <title id="t-rd">How to Read an Astrocartography Map — Reading Order</title>
  <desc id="d-rd">A seven-step reading order for interpreting an astrocartography map: 1) verify birth time, 2) identify your home city on the globe, 3) read the line passing closest to it, 4) check Sun and Moon line locations, 5) note any outer planet lines crossing populated regions, 6) look for parans at your latitude, 7) compare cities you have actually lived in.</desc>

  <rect width="820" height="640" fill="#FBF8F1"/>

  <defs>
    <radialGradient id="aurora-rd" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#19C68B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#19C68B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="180" fill="url(#aurora-rd)"/>

  <text x="410" y="46" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="4">★  READING ORDER  ★</text>

  <text x="410" y="98" font-family="'Instrument Serif',Georgia,serif" font-size="38" fill="#181C23" text-anchor="middle">Seven steps, <tspan font-style="italic" fill="#4C5563">always in this order.</tspan></text>
  <text x="410" y="132" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#8A93A2" text-anchor="middle">Skip a step and the map starts contradicting itself.</text>

  <line x1="60" y1="190" x2="760" y2="190" stroke="#DDD5C2" stroke-width="1"/>

  <!-- Step 1 -->
  <g>
    <circle cx="100" cy="232" r="26" fill="#19C68B"/>
    <text x="100" y="240" font-family="'Instrument Serif',Georgia,serif" font-size="22" fill="#06241A" text-anchor="middle" font-weight="600">1</text>
    <text x="150" y="222" font-family="'Instrument Serif',Georgia,serif" font-size="20" fill="#181C23">Verify your exact birth time</text>
    <text x="150" y="244" font-size="13" fill="#4C5563">Without this, ASC and DC lines are guesses. MC and IC survive small errors.</text>
  </g>
  <line x1="60" y1="270" x2="760" y2="270" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Step 2 -->
  <g>
    <circle cx="100" cy="298" r="26" fill="#FFFFFF" stroke="#19C68B" stroke-width="2"/>
    <text x="100" y="306" font-family="'Instrument Serif',Georgia,serif" font-size="22" fill="#0E7C5B" text-anchor="middle" font-weight="600">2</text>
    <text x="150" y="288" font-family="'Instrument Serif',Georgia,serif" font-size="20" fill="#181C23">Locate your home city on the globe</text>
    <text x="150" y="310" font-size="13" fill="#4C5563">Anchor every reading to where you actually live before anywhere else.</text>
  </g>
  <line x1="60" y1="336" x2="760" y2="336" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Step 3 -->
  <g>
    <circle cx="100" cy="364" r="26" fill="#FFFFFF" stroke="#19C68B" stroke-width="2"/>
    <text x="100" y="372" font-family="'Instrument Serif',Georgia,serif" font-size="22" fill="#0E7C5B" text-anchor="middle" font-weight="600">3</text>
    <text x="150" y="354" font-family="'Instrument Serif',Georgia,serif" font-size="20" fill="#181C23">Read the closest line to your city</text>
    <text x="150" y="376" font-size="13" fill="#4C5563">Which planet, which angle, how far. This is your "current line".</text>
  </g>
  <line x1="60" y1="402" x2="760" y2="402" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Step 4 -->
  <g>
    <circle cx="100" cy="430" r="26" fill="#FFFFFF" stroke="#19C68B" stroke-width="2"/>
    <text x="100" y="438" font-family="'Instrument Serif',Georgia,serif" font-size="22" fill="#0E7C5B" text-anchor="middle" font-weight="600">4</text>
    <text x="150" y="420" font-family="'Instrument Serif',Georgia,serif" font-size="20" fill="#181C23">Find your Sun line and Moon line</text>
    <text x="150" y="442" font-size="13" fill="#4C5563">Where do they run? Through which cities? These are the luminaries.</text>
  </g>
  <line x1="60" y1="468" x2="760" y2="468" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Step 5 -->
  <g>
    <circle cx="100" cy="496" r="26" fill="#FFFFFF" stroke="#19C68B" stroke-width="2"/>
    <text x="100" y="504" font-family="'Instrument Serif',Georgia,serif" font-size="22" fill="#0E7C5B" text-anchor="middle" font-weight="600">5</text>
    <text x="150" y="486" font-family="'Instrument Serif',Georgia,serif" font-size="20" fill="#181C23">Note outer-planet lines crossing major cities</text>
    <text x="150" y="508" font-size="13" fill="#4C5563">Saturn, Pluto, Uranus — slow but consequential. Pay attention to where they land.</text>
  </g>
  <line x1="60" y1="534" x2="760" y2="534" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Step 6 -->
  <g>
    <circle cx="100" cy="562" r="26" fill="#FFFFFF" stroke="#19C68B" stroke-width="2"/>
    <text x="100" y="570" font-family="'Instrument Serif',Georgia,serif" font-size="22" fill="#0E7C5B" text-anchor="middle" font-weight="600">6</text>
    <text x="150" y="552" font-family="'Instrument Serif',Georgia,serif" font-size="20" fill="#181C23">Check for parans at your latitude</text>
    <text x="150" y="574" font-size="13" fill="#4C5563">Line crossings can be felt thousands of km from either parent line.</text>
  </g>
  <line x1="60" y1="600" x2="760" y2="600" stroke="#181C23" stroke-width="1"/>

  <!-- Step 7 (final, dark) -->
  <g>
    <circle cx="100" cy="624" r="14" fill="#0B1118"/>
    <text x="100" y="630" font-family="'Instrument Serif',Georgia,serif" font-size="14" fill="#19C68B" text-anchor="middle" font-weight="600">7</text>
    <text x="150" y="624" font-family="'Instrument Serif',Georgia,serif" font-size="18" fill="#181C23">Validate against cities you have actually lived in</text>
  </g>
</svg>
