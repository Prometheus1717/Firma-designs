<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-fr d-fr">
  <title id="t-fr">Five people, five astrocartography readings</title>
  <desc id="d-fr">Five reader types and the line each one looks for: the one who feels stuck looks at the Sun and Ascendant line for identity and vitality; the one seeking love looks at the Venus and Descendant line; the one chasing a career looks at the Midheaven and Jupiter line; the one burning out looks at the Moon and Imum Coeli line for rest and home; the one starting over looks at a fresh angle for a clean beginning.</desc>

  <rect width="820" height="560" fill="#FBF8F1"/>
  <text x="40" y="50" font-family="'Instrument Serif',Georgia,serif" font-size="30" fill="#181C23">Five people, five readings</text>
  <text x="40" y="76" font-size="13" fill="#4C5563">Astrocartography is not one answer — it is a different answer depending on the question you carry.</text>

  <!-- rows -->
  <g>
    <!-- 1 stuck -->
    <rect x="40" y="98" width="740" height="80" rx="14" fill="#FFFFFF" stroke="#E7E0D1"/>
    <circle cx="78" cy="138" r="20" fill="#FAEBD2"/><text x="78" y="145" text-anchor="middle" font-size="20" fill="#A8650F">☉</text>
    <text x="118" y="130" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">“I feel invisible, like myself on mute.”</text>
    <text x="118" y="156" font-size="13" fill="#4C5563">Looks at: <tspan font-weight="600" fill="#A8650F">Sun / Ascendant line</tspan> — identity, vitality, being seen</text>
    <text x="762" y="144" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2">→ feels turned-up again</text>

    <!-- 2 love -->
    <rect x="40" y="190" width="740" height="80" rx="14" fill="#FFFFFF" stroke="#E7E0D1"/>
    <circle cx="78" cy="230" r="20" fill="#F9E3E0"/><text x="78" y="237" text-anchor="middle" font-size="20" fill="#B2543F">♀</text>
    <text x="118" y="222" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">“Why does love never land here?”</text>
    <text x="118" y="248" font-size="13" fill="#4C5563">Looks at: <tspan font-weight="600" fill="#B2543F">Venus / Descendant line</tspan> — warmth, attraction, partnership</text>
    <text x="762" y="236" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2">→ feels open, met</text>

    <!-- 3 career -->
    <rect x="40" y="282" width="740" height="80" rx="14" fill="#FFFFFF" stroke="#E7E0D1"/>
    <circle cx="78" cy="322" r="20" fill="#FAEBD2"/><text x="78" y="329" text-anchor="middle" font-size="20" fill="#A8650F">♃</text>
    <text x="118" y="314" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">“I work hard and nothing opens.”</text>
    <text x="118" y="340" font-size="13" fill="#4C5563">Looks at: <tspan font-weight="600" fill="#A8650F">Midheaven / Jupiter line</tspan> — visibility, luck, growth</text>
    <text x="762" y="328" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2">→ doors start opening</text>

    <!-- 4 burnout -->
    <rect x="40" y="374" width="740" height="80" rx="14" fill="#FFFFFF" stroke="#E7E0D1"/>
    <circle cx="78" cy="414" r="20" fill="#E9E5F9"/><text x="78" y="421" text-anchor="middle" font-size="20" fill="#5D4FB8">☽</text>
    <text x="118" y="406" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">“I'm exhausted and never at home.”</text>
    <text x="118" y="432" font-size="13" fill="#4C5563">Looks at: <tspan font-weight="600" fill="#5D4FB8">Moon / Imum Coeli line</tspan> — rest, safety, roots</text>
    <text x="762" y="420" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2">→ feels held, rested</text>

    <!-- 5 starting over -->
    <rect x="40" y="466" width="740" height="80" rx="14" fill="#0B1118"/>
    <circle cx="78" cy="506" r="20" fill="#19C68B"/><text x="78" y="513" text-anchor="middle" font-size="19" fill="#06241A">✦</text>
    <text x="118" y="498" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#EAF2EE">“Everything ended. I need a clean page.”</text>
    <text x="118" y="524" font-size="13" fill="#C2CDC8">Looks at: <tspan font-weight="600" fill="#19C68B">a fresh angle</tspan> — a place with no old story attached</text>
    <text x="762" y="512" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11" fill="#19C68B">→ feels like a beginning</text>
  </g>
</svg>
