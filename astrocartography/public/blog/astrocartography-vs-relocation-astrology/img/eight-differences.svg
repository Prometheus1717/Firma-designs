<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-ed d-ed">
  <title id="t-ed">Astrocartography vs. Relocation Astrology — 8 Key Differences</title>
  <desc id="d-ed">A clear comparison table of astrocartography and relocation astrology across eight dimensions: what it shows, output type, scope, depth, ease of use, time to first reading, ideal use case, and best decision context.</desc>

  <rect width="820" height="820" fill="#FBF8F1"/>

  <defs>
    <radialGradient id="aurora-ed" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#5D4FB8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0E7C5B" stop-opacity="0.08"/>
    </radialGradient>
  </defs>
  <rect width="820" height="180" fill="url(#aurora-ed)"/>

  <text x="410" y="46" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="4">★  TWO TECHNIQUES, ONE QUESTION  ★</text>

  <text x="410" y="98" font-family="'Instrument Serif',Georgia,serif" font-size="38" fill="#181C23" text-anchor="middle">Astrocartography or <tspan font-style="italic" fill="#4C5563">relocation chart?</tspan></text>
  <text x="410" y="132" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#8A93A2" text-anchor="middle">Eight dimensions across which they diverge — and when to use which.</text>

  <line x1="40" y1="190" x2="780" y2="190" stroke="#DDD5C2" stroke-width="1"/>
  <text x="60" y="216" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2" letter-spacing="2">DIMENSION</text>
  <text x="380" y="216" font-family="'JetBrains Mono',monospace" font-size="11" fill="#5D4FB8" letter-spacing="2" text-anchor="middle">ASTROCARTOGRAPHY</text>
  <text x="640" y="216" font-family="'JetBrains Mono',monospace" font-size="11" fill="#0E7C5B" letter-spacing="2" text-anchor="middle">RELOCATION CHART</text>
  <line x1="40" y1="226" x2="780" y2="226" stroke="#181C23" stroke-width="1.2"/>

  <!-- Row 1: What it shows -->
  <rect x="40" y="230" width="740" height="56" fill="#FFFFFF"/>
  <text x="60" y="260" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#181C23">What it shows</text>
  <text x="380" y="260" font-size="13" fill="#181C23" text-anchor="middle">Planetary lines across Earth</text>
  <text x="640" y="260" font-size="13" fill="#181C23" text-anchor="middle">Full chart for a new city</text>
  <line x1="40" y1="286" x2="780" y2="286" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Row 2: Output type -->
  <rect x="40" y="288" width="740" height="56" fill="#FBF8F1"/>
  <text x="60" y="318" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#181C23">Output type</text>
  <text x="380" y="318" font-size="13" fill="#181C23" text-anchor="middle">Visual map · 40 lines</text>
  <text x="640" y="318" font-size="13" fill="#181C23" text-anchor="middle">Wheel chart · houses + aspects</text>
  <line x1="40" y1="344" x2="780" y2="344" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Row 3: Scope -->
  <rect x="40" y="346" width="740" height="56" fill="#FFFFFF"/>
  <text x="60" y="376" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#181C23">Scope</text>
  <text x="380" y="376" font-size="13" fill="#181C23" text-anchor="middle">Global · all locations at once</text>
  <text x="640" y="376" font-size="13" fill="#181C23" text-anchor="middle">One city per chart</text>
  <line x1="40" y1="402" x2="780" y2="402" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Row 4: Depth -->
  <rect x="40" y="404" width="740" height="56" fill="#FBF8F1"/>
  <text x="60" y="434" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#181C23">Depth per location</text>
  <text x="380" y="434" font-size="13" fill="#5D4FB8" text-anchor="middle">★★★☆☆</text>
  <text x="640" y="434" font-size="13" fill="#0E7C5B" text-anchor="middle">★★★★★</text>
  <line x1="40" y1="460" x2="780" y2="460" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Row 5: Ease of use -->
  <rect x="40" y="462" width="740" height="56" fill="#FFFFFF"/>
  <text x="60" y="492" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#181C23">Ease of use</text>
  <text x="380" y="492" font-size="13" fill="#5D4FB8" text-anchor="middle">★★★★★ (beginner-friendly)</text>
  <text x="640" y="492" font-size="13" fill="#0E7C5B" text-anchor="middle">★★☆☆☆ (needs astrology)</text>
  <line x1="40" y1="518" x2="780" y2="518" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Row 6: Time to first reading -->
  <rect x="40" y="520" width="740" height="56" fill="#FBF8F1"/>
  <text x="60" y="550" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#181C23">Time to first reading</text>
  <text x="380" y="550" font-size="13" fill="#5D4FB8" text-anchor="middle">10 minutes</text>
  <text x="640" y="550" font-size="13" fill="#0E7C5B" text-anchor="middle">2–3 hours per city</text>
  <line x1="40" y1="576" x2="780" y2="576" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Row 7: Ideal use case -->
  <rect x="40" y="578" width="740" height="56" fill="#FFFFFF"/>
  <text x="60" y="608" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#181C23">Ideal use case</text>
  <text x="380" y="608" font-size="13" fill="#181C23" text-anchor="middle">Initial exploration · shortlist</text>
  <text x="640" y="608" font-size="13" fill="#181C23" text-anchor="middle">Final decision · deep planning</text>
  <line x1="40" y1="634" x2="780" y2="634" stroke="#E7E0D1" stroke-width="1"/>

  <!-- Row 8: Best when -->
  <rect x="40" y="636" width="740" height="56" fill="#0B1118"/>
  <text x="60" y="666" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#EAF2EE">Best when you</text>
  <text x="380" y="666" font-size="13" fill="#C8D8E8" text-anchor="middle">Don't know where to look</text>
  <text x="640" y="666" font-size="13" fill="#C8D8E8" text-anchor="middle">Already have 2–3 candidates</text>

  <!-- BOTTOM VERDICT -->
  <rect x="40" y="710" width="740" height="80" rx="22" fill="#DCF2E5" stroke="#C2E5D2"/>
  <text x="60" y="738" font-family="'JetBrains Mono',monospace" font-size="11" fill="#0E7C5B" letter-spacing="2">USE BOTH, IN ORDER</text>
  <text x="60" y="762" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="16" fill="#06241A">Start with astrocartography to find candidate cities.</text>
  <text x="60" y="780" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="16" fill="#06241A">Then build relocation charts for your top 2–3 finalists.</text>
</svg>
