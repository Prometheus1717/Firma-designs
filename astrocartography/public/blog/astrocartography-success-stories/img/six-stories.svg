<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-ss d-ss">
  <title id="t-ss">Six composite astrocartography stories</title>
  <desc id="d-ss">Six illustrative composite stories of people who moved toward a planetary line: an indie hacker on a Jupiter–Midheaven line in Hanoi who grew revenue; someone who found love on a Venus–Descendant line in Lisbon; a burnout recovery on a Moon–IC line in a quiet coastal town; a career breakthrough on a Sun–Midheaven line; a creative reawakening on a Neptune–Venus line in Mexico City; a fresh start on a clean supportive angle after loss. These are composite illustrations, not individual testimonials.</desc>

  <rect width="860" height="560" fill="#FBF8F1"/>
  <text x="40" y="48" font-family="'Instrument Serif',Georgia,serif" font-size="30" fill="#181C23">Six lives, six lines</text>
  <text x="40" y="74" font-size="13" fill="#4C5563">Composite portraits — the kind of shift people describe after moving toward a supportive line.</text>

  <!-- cards 2 columns x 3 rows -->
  <!-- 1 indie hacker -->
  <rect x="40" y="96" width="390" height="138" rx="16" fill="#FFFFFF" stroke="#E7E0D1"/>
  <circle cx="74" cy="130" r="16" fill="#FAEBD2"/><text x="74" y="136" text-anchor="middle" font-size="16" fill="#A8650F">♃</text>
  <text x="102" y="126" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">The indie hacker · Hanoi</text>
  <text x="102" y="148" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#A8650F">JUPITER / MC LINE</text>
  <text x="58" y="176" font-size="13" fill="#4C5563">Shipped on a 3-month build sprint; the</text>
  <text x="58" y="194" font-size="13" fill="#4C5563">app finally found its market.</text>
  <text x="58" y="220" font-size="13" fill="#0E7C5B" font-weight="600">→ a standout quarter for revenue</text>

  <!-- 2 love -->
  <rect x="440" y="96" width="390" height="138" rx="16" fill="#FFFFFF" stroke="#E7E0D1"/>
  <circle cx="474" cy="130" r="16" fill="#F9E3E0"/><text x="474" y="136" text-anchor="middle" font-size="16" fill="#B2543F">♀</text>
  <text x="502" y="126" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">The one who'd given up · Lisbon</text>
  <text x="502" y="148" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#B2543F">VENUS / DC LINE</text>
  <text x="458" y="176" font-size="13" fill="#4C5563">Stopped trying so hard; suddenly felt</text>
  <text x="458" y="194" font-size="13" fill="#4C5563">open, warm, easy to be around.</text>
  <text x="458" y="220" font-size="13" fill="#0E7C5B" font-weight="600">→ a relationship that finally took root</text>

  <!-- 3 burnout -->
  <rect x="40" y="250" width="390" height="138" rx="16" fill="#FFFFFF" stroke="#E7E0D1"/>
  <circle cx="74" cy="284" r="16" fill="#E9E5F9"/><text x="74" y="290" text-anchor="middle" font-size="16" fill="#5D4FB8">☽</text>
  <text x="102" y="280" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">The exhausted one · coast</text>
  <text x="102" y="302" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#5D4FB8">MOON / IC LINE</text>
  <text x="58" y="330" font-size="13" fill="#4C5563">Slept through the night again; the</text>
  <text x="58" y="348" font-size="13" fill="#4C5563">armour finally came off.</text>
  <text x="58" y="374" font-size="13" fill="#0E7C5B" font-weight="600">→ rest that actually refilled</text>

  <!-- 4 career -->
  <rect x="440" y="250" width="390" height="138" rx="16" fill="#FFFFFF" stroke="#E7E0D1"/>
  <circle cx="474" cy="284" r="16" fill="#FAEBD2"/><text x="474" y="290" text-anchor="middle" font-size="16" fill="#A8650F">☉</text>
  <text x="502" y="280" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">The overlooked one · big city</text>
  <text x="502" y="302" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#A8650F">SUN / MC LINE</text>
  <text x="458" y="330" font-size="13" fill="#4C5563">Same skills, new room — and people</text>
  <text x="458" y="348" font-size="13" fill="#4C5563">finally noticed the work.</text>
  <text x="458" y="374" font-size="13" fill="#0E7C5B" font-weight="600">→ the promotion that wouldn't come</text>

  <!-- 5 creative -->
  <rect x="40" y="404" width="390" height="138" rx="16" fill="#FFFFFF" stroke="#E7E0D1"/>
  <circle cx="74" cy="438" r="16" fill="#E9E5F9"/><text x="74" y="444" text-anchor="middle" font-size="16" fill="#5D4FB8">♆</text>
  <text x="102" y="434" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">The blocked artist · Mexico City</text>
  <text x="102" y="456" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#5D4FB8">NEPTUNE / VENUS LINE</text>
  <text x="58" y="484" font-size="13" fill="#4C5563">The work came back — softer, stranger,</text>
  <text x="58" y="502" font-size="13" fill="#4C5563">more alive than it had in years.</text>
  <text x="58" y="528" font-size="13" fill="#0E7C5B" font-weight="600">→ a body of work, finished</text>

  <!-- 6 fresh start -->
  <rect x="440" y="404" width="390" height="138" rx="16" fill="#0B1118"/>
  <circle cx="474" cy="438" r="16" fill="#19C68B"/><text x="474" y="444" text-anchor="middle" font-size="15" fill="#06241A">✦</text>
  <text x="502" y="434" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#EAF2EE">The one starting over · new city</text>
  <text x="502" y="456" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#19C68B">A CLEAN, SUPPORTIVE ANGLE</text>
  <text x="458" y="484" font-size="13" fill="#C2CDC8">A place with none of the old story</text>
  <text x="458" y="502" font-size="13" fill="#C2CDC8">in it — room to become someone new.</text>
  <text x="458" y="528" font-size="13" fill="#19C68B" font-weight="600">→ a first chapter that felt possible</text>
</svg>
