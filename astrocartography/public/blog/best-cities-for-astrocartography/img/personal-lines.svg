<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-pl d-pl">
  <title id="t-pl">The same city is a different place on every chart</title>
  <desc id="d-pl">An explainer: a city like Lisbon is not universally a Venus city. For one person Lisbon may sit on a Venus line (love), for another on a Saturn line (hard work), for a third it may carry no strong line at all. Whether a popular city helps you depends entirely on your own birth chart.</desc>

  <rect width="820" height="360" fill="#FBF8F1"/>
  <text x="410" y="48" text-anchor="middle" font-family="'Instrument Serif',Georgia,serif" font-size="27" fill="#181C23">The same city, three different charts</text>
  <text x="410" y="73" text-anchor="middle" font-size="13" fill="#4C5563">A city is only “a Venus city” if your Venus line runs through it. Lists are a starting point — your chart decides.</text>

  <!-- city node -->
  <rect x="350" y="100" width="120" height="46" rx="12" fill="#181C23"/>
  <text x="410" y="129" text-anchor="middle" font-size="15" fill="#FBF8F1" font-weight="600">Lisbon</text>

  <!-- three branches -->
  <g stroke="#DDD5C2" stroke-width="1.5" fill="none">
    <path d="M360 146 L160 210"/><path d="M410 146 L410 210"/><path d="M460 146 L660 210"/>
  </g>

  <rect x="60" y="214" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#F9E3E0"/>
  <text x="160" y="246" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#B2543F">CHART A</text>
  <text x="160" y="274" text-anchor="middle" font-size="14" fill="#181C23" font-weight="600">Venus line</text>
  <text x="160" y="298" text-anchor="middle" font-size="12.5" fill="#4C5563">→ warmth, love, ease</text>

  <rect x="310" y="214" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#E7E0D1"/>
  <text x="410" y="246" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#4C5563">CHART B</text>
  <text x="410" y="274" text-anchor="middle" font-size="14" fill="#181C23" font-weight="600">Saturn line</text>
  <text x="410" y="298" text-anchor="middle" font-size="12.5" fill="#4C5563">→ work, weight, mastery</text>

  <rect x="560" y="214" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#E7E0D1"/>
  <text x="660" y="246" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2">CHART C</text>
  <text x="660" y="274" text-anchor="middle" font-size="14" fill="#181C23" font-weight="600">No strong line</text>
  <text x="660" y="298" text-anchor="middle" font-size="12.5" fill="#4C5563">→ pleasant, but neutral</text>
</svg>
