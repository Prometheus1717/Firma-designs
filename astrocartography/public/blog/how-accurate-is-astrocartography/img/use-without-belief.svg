<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-uwb d-uwb">
  <title id="t-uwb">How to Use Astrocartography Without Believing In It — A Pragmatic Frame</title>
  <desc id="d-uwb">A pragmatic decision frame for using astrocartography regardless of belief: as a decision aid that surfaces hidden preferences, as a structured way to compare cities, as a creative writing prompt, as a community language — without requiring scientific validation.</desc>

  <rect width="820" height="600" fill="#FBF8F1"/>

  <defs>
    <radialGradient id="aurora-uwb" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#19C68B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#19C68B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="180" fill="url(#aurora-uwb)"/>

  <text x="410" y="46" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="4">★  THE PRAGMATIC FRAME  ★</text>

  <text x="410" y="98" font-family="'Instrument Serif',Georgia,serif" font-size="38" fill="#181C23" text-anchor="middle">Use it without <tspan font-style="italic" fill="#4C5563">believing it.</tspan></text>
  <text x="410" y="132" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#8A93A2" text-anchor="middle">Four legitimate uses that do not require it to be "true".</text>

  <line x1="60" y1="190" x2="760" y2="190" stroke="#DDD5C2" stroke-width="1"/>

  <!-- USE 1: Decision aid -->
  <g>
    <rect x="60" y="210" width="345" height="170" rx="22" fill="#FFFFFF" stroke="#DCF2E5" stroke-width="2"/>
    <text x="232" y="240" font-family="'JetBrains Mono',monospace" font-size="10.5" text-anchor="middle" fill="#0E7C5B" letter-spacing="2">USE 01</text>
    <text x="232" y="272" font-family="'Instrument Serif',Georgia,serif" font-size="26" text-anchor="middle" fill="#181C23">As a decision mirror</text>

    <text x="86" y="310" font-size="13" fill="#4C5563">When the calculator says "Sun MC for Berlin",</text>
    <text x="86" y="328" font-size="13" fill="#4C5563">your reaction reveals what you already wanted.</text>
    <text x="86" y="346" font-size="13" fill="#4C5563">If you feel relief — you wanted it.</text>
    <text x="86" y="364" font-size="13" fill="#181C23"><tspan font-style="italic" fill="#0E7C5B">Works for atheists.</tspan></text>
  </g>

  <!-- USE 2: City comparison -->
  <g>
    <rect x="415" y="210" width="345" height="170" rx="22" fill="#FFFFFF" stroke="#E9E5F9" stroke-width="2"/>
    <text x="587" y="240" font-family="'JetBrains Mono',monospace" font-size="10.5" text-anchor="middle" fill="#5D4FB8" letter-spacing="2">USE 02</text>
    <text x="587" y="272" font-family="'Instrument Serif',Georgia,serif" font-size="26" text-anchor="middle" fill="#181C23">As a structured filter</text>

    <text x="441" y="310" font-size="13" fill="#4C5563">Comparing 5 cities for a job offer? Astrocartography</text>
    <text x="441" y="328" font-size="13" fill="#4C5563">gives 5 different sets of "themes" you might not</text>
    <text x="441" y="346" font-size="13" fill="#4C5563">have considered. The structure is the value.</text>
    <text x="441" y="364" font-size="13" fill="#181C23"><tspan font-style="italic" fill="#5D4FB8">Works as forced framing.</tspan></text>
  </g>

  <!-- USE 3: Creative prompt -->
  <g>
    <rect x="60" y="395" width="345" height="170" rx="22" fill="#FFFFFF" stroke="#FAEBD2" stroke-width="2"/>
    <text x="232" y="425" font-family="'JetBrains Mono',monospace" font-size="10.5" text-anchor="middle" fill="#A8650F" letter-spacing="2">USE 03</text>
    <text x="232" y="457" font-family="'Instrument Serif',Georgia,serif" font-size="26" text-anchor="middle" fill="#181C23">As a creative prompt</text>

    <text x="86" y="495" font-size="13" fill="#4C5563">Writers, designers, founders use chart language as</text>
    <text x="86" y="513" font-size="13" fill="#4C5563">a generative source — "What would a Venus city</text>
    <text x="86" y="531" font-size="13" fill="#4C5563">version of this product feel like?"</text>
    <text x="86" y="549" font-size="13" fill="#181C23"><tspan font-style="italic" fill="#A8650F">Works as imagination engine.</tspan></text>
  </g>

  <!-- USE 4: Community language -->
  <g>
    <rect x="415" y="395" width="345" height="170" rx="22" fill="#0B1118"/>
    <text x="587" y="425" font-family="'JetBrains Mono',monospace" font-size="10.5" text-anchor="middle" fill="#19C68B" letter-spacing="2">USE 04</text>
    <text x="587" y="457" font-family="'Instrument Serif',Georgia,serif" font-size="26" text-anchor="middle" fill="#EAF2EE">As shared language</text>

    <text x="441" y="495" font-size="13" fill="#C8D8E8">Millions of people speak in astrocartography terms.</text>
    <text x="441" y="513" font-size="13" fill="#C8D8E8">"I have a Saturn line in Berlin" is now meaningful</text>
    <text x="441" y="531" font-size="13" fill="#C8D8E8">in a way no scientific frame is.</text>
    <text x="441" y="549" font-size="13" fill="#EAF2EE"><tspan font-style="italic" fill="#19C68B">Works as social currency.</tspan></text>
  </g>
</svg>
