<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-ts d-ts">
  <title id="t-ts">Two Standards of Accuracy in Astrocartography — Math vs. Meaning</title>
  <desc id="d-ts">A two-column comparison showing that astronomical calculation accuracy is documented per tool and depends on inputs, while astrological interpretation is symbolic and lacks scientific validation.</desc>

  <rect width="820" height="580" fill="#FBF8F1"/>

  <defs>
    <radialGradient id="aurora-ts" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#5D4FB8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5D4FB8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="180" fill="url(#aurora-ts)"/>

  <text x="410" y="46" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="4">★  TWO QUESTIONS, NOT ONE  ★</text>

  <text x="410" y="98" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#181C23" text-anchor="middle">"Is it <tspan font-style="italic" fill="#4C5563">accurate?"</tspan></text>
  <text x="410" y="130" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#8A93A2" text-anchor="middle">The wrong question — because astrocartography hides two separate questions inside it.</text>

  <!-- LEFT: Astronomical -->
  <g>
    <rect x="40" y="170" width="350" height="320" rx="22" fill="#FFFFFF" stroke="#DCF2E5" stroke-width="2"/>

    <text x="215" y="200" font-family="'JetBrains Mono',monospace" font-size="10.5" text-anchor="middle" fill="#0E7C5B" letter-spacing="2">─── QUESTION 1 ───</text>
    <text x="215" y="230" font-family="'Instrument Serif',Georgia,serif" font-size="26" text-anchor="middle" fill="#181C23">Astronomical</text>
    <text x="215" y="252" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="14" text-anchor="middle" fill="#0E7C5B">Where was the planet?</text>

    <text x="215" y="306" font-family="'Instrument Serif',Georgia,serif" font-size="58" text-anchor="middle" fill="#0E7C5B">✓</text>

    <text x="215" y="346" font-family="'Instrument Serif',Georgia,serif" font-size="22" text-anchor="middle" fill="#181C23">Documented per tool</text>

    <text x="60" y="384" font-size="13" fill="#4C5563">Engine, birth data, time zone</text>
    <text x="60" y="402" font-size="13" fill="#4C5563">and projection each affect</text>
    <text x="60" y="420" font-size="13" fill="#4C5563">the final line placement.</text>

    <text x="60" y="450" font-family="'JetBrains Mono',monospace" font-size="10" fill="#0E7C5B" letter-spacing="1.5">VERDICT</text>
    <text x="60" y="470" font-size="13" fill="#181C23">No serious tool in 2026 disagrees</text>
    <text x="60" y="486" font-size="13" fill="#181C23">on where the planets were.</text>
  </g>

  <!-- ARROW divider -->
  <line x1="410" y1="200" x2="410" y2="460" stroke="#DDD5C2" stroke-width="1"/>
  <text x="410" y="340" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="22" text-anchor="middle" fill="#8A93A2">vs.</text>

  <!-- RIGHT: Interpretive -->
  <g>
    <rect x="430" y="170" width="350" height="320" rx="22" fill="#FFFFFF" stroke="#E9E5F9" stroke-width="2"/>

    <text x="605" y="200" font-family="'JetBrains Mono',monospace" font-size="10.5" text-anchor="middle" fill="#5D4FB8" letter-spacing="2">─── QUESTION 2 ───</text>
    <text x="605" y="230" font-family="'Instrument Serif',Georgia,serif" font-size="26" text-anchor="middle" fill="#181C23">Interpretive</text>
    <text x="605" y="252" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="14" text-anchor="middle" fill="#5D4FB8">What does the line mean?</text>

    <text x="605" y="306" font-family="'Instrument Serif',Georgia,serif" font-size="50" text-anchor="middle" fill="#5D4FB8">~?</text>

    <text x="605" y="346" font-family="'Instrument Serif',Georgia,serif" font-size="22" text-anchor="middle" fill="#181C23">Open question</text>

    <text x="450" y="384" font-size="13" fill="#4C5563">Jim Lewis tradition, modern</text>
    <text x="450" y="402" font-size="13" fill="#4C5563">psychological astrology, evolutionary</text>
    <text x="450" y="420" font-size="13" fill="#4C5563">school — all disagree.</text>

    <text x="450" y="450" font-family="'JetBrains Mono',monospace" font-size="10" fill="#5D4FB8" letter-spacing="1.5">VERDICT</text>
    <text x="450" y="470" font-size="13" fill="#181C23">No scientific consensus exists,</text>
    <text x="450" y="486" font-size="13" fill="#181C23">and probably cannot.</text>
  </g>

  <!-- BOTTOM TAKEAWAY -->
  <rect x="40" y="510" width="740" height="50" rx="14" fill="#0B1118"/>
  <text x="60" y="535" font-family="'JetBrains Mono',monospace" font-size="11" fill="#19C68B" letter-spacing="2">THE TRAP</text>
  <text x="60" y="552" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#EAF2EE">Most arguments about whether astrocartography "works" confuse Question 1 with Question 2.</text>
</svg>
