<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 660" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-ev d-ev">
  <title id="t-ev">The Evidence Landscape for Astrocartography — Honest Assessment</title>
  <desc id="d-ev">An evidence hierarchy for astrocartography: controlled replicated evidence is not established; case archives, community self-reports and first-person testimony are weaker and vulnerable to selection and confirmation bias.</desc>

  <rect width="820" height="660" fill="#FBF8F1"/>

  <defs>
    <radialGradient id="aurora-ev" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#A8650F" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#A8650F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="180" fill="url(#aurora-ev)"/>

  <text x="410" y="46" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="4">★  WHAT THE EVIDENCE SAYS  ★</text>

  <text x="410" y="98" font-family="'Instrument Serif',Georgia,serif" font-size="38" fill="#181C23" text-anchor="middle">Four kinds of <tspan font-style="italic" fill="#4C5563">evidence,</tspan></text>
  <text x="410" y="138" font-family="'Instrument Serif',Georgia,serif" font-size="38" fill="#181C23" text-anchor="middle">none of them <tspan font-style="italic" fill="#4C5563">definitive.</tspan></text>

  <line x1="60" y1="190" x2="760" y2="190" stroke="#DDD5C2" stroke-width="1"/>
  <text x="60" y="214" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#8A93A2" letter-spacing="2.5">FOUR EVIDENCE TIERS · HONESTLY RANKED</text>

  <!-- TIER 1: Double-blind RCT (red - missing) -->
  <g>
    <rect x="60" y="230" width="700" height="86" fill="#FFFFFF"/>
    <text x="84" y="260" font-family="'Instrument Serif',Georgia,serif" font-size="22" font-style="italic" fill="#181C23">Tier 1 · Double-blind RCTs</text>
    <text x="84" y="282" font-size="13" fill="#4C5563">The gold standard. Pre-registered, blinded, replicable, statistically powered.</text>
    <text x="84" y="302" font-size="13" fill="#B2543F" font-style="italic">Status: none exist. Astrocartography has never been studied at this rigor.</text>

    <text x="600" y="262" font-family="'JetBrains Mono',monospace" font-size="11" fill="#B2543F" letter-spacing="1" text-anchor="middle">EVIDENCE</text>
    <text x="600" y="294" font-family="'Instrument Serif',Georgia,serif" font-size="48" fill="#B2543F" text-anchor="middle">○</text>
    <text x="600" y="310" font-family="'JetBrains Mono',monospace" font-size="10" fill="#B2543F" text-anchor="middle" letter-spacing="0.5">ZERO</text>
  </g>
  <line x1="60" y1="318" x2="760" y2="318" stroke="#E7E0D1" stroke-width="1"/>

  <!-- TIER 2: Lewis case archives (amber - some) -->
  <g>
    <rect x="60" y="320" width="700" height="86" fill="#FBF8F1"/>
    <text x="84" y="350" font-family="'Instrument Serif',Georgia,serif" font-size="22" font-style="italic" fill="#181C23">Tier 2 · Jim Lewis case archives</text>
    <text x="84" y="372" font-size="13" fill="#4C5563">The original astrocartography corpus — thousands of client charts from the 1970s/80s.</text>
    <text x="84" y="392" font-size="13" fill="#A8650F" font-style="italic">Status: rich but selection-biased. Lewis kept the successes, not the failures.</text>

    <text x="600" y="352" font-family="'JetBrains Mono',monospace" font-size="11" fill="#A8650F" letter-spacing="1" text-anchor="middle">EVIDENCE</text>
    <text x="600" y="384" font-family="'Instrument Serif',Georgia,serif" font-size="48" fill="#A8650F" text-anchor="middle">●</text>
    <text x="600" y="400" font-family="'JetBrains Mono',monospace" font-size="10" fill="#A8650F" text-anchor="middle" letter-spacing="0.5">SUGGESTIVE</text>
  </g>
  <line x1="60" y1="406" x2="760" y2="406" stroke="#E7E0D1" stroke-width="1"/>

  <!-- TIER 3: Contemporary self-report (lavender - some) -->
  <g>
    <rect x="60" y="408" width="700" height="86" fill="#FFFFFF"/>
    <text x="84" y="438" font-family="'Instrument Serif',Georgia,serif" font-size="22" font-style="italic" fill="#181C23">Tier 3 · Contemporary self-report surveys</text>
    <text x="84" y="460" font-size="13" fill="#4C5563">Community self-reports lack a published representative sampling frame.</text>
    <text x="84" y="480" font-size="13" fill="#5D4FB8" font-style="italic">Status: descriptive only. Selection and confirmation bias are unresolved.</text>

    <text x="600" y="440" font-family="'JetBrains Mono',monospace" font-size="11" fill="#5D4FB8" letter-spacing="1" text-anchor="middle">EVIDENCE</text>
    <text x="600" y="472" font-family="'Instrument Serif',Georgia,serif" font-size="48" fill="#5D4FB8" text-anchor="middle">◐</text>
    <text x="600" y="488" font-family="'JetBrains Mono',monospace" font-size="10" fill="#5D4FB8" text-anchor="middle" letter-spacing="0.5">CORRELATIONAL</text>
  </g>
  <line x1="60" y1="494" x2="760" y2="494" stroke="#E7E0D1" stroke-width="1"/>

  <!-- TIER 4: First-person testimony (mint - lots) -->
  <g>
    <rect x="60" y="496" width="700" height="86" fill="#FBF8F1"/>
    <text x="84" y="526" font-family="'Instrument Serif',Georgia,serif" font-size="22" font-style="italic" fill="#181C23">Tier 4 · First-person testimony</text>
    <text x="84" y="548" font-size="13" fill="#4C5563">Reddit (r/astrocartography), forums, podcasts — millions of post-move anecdotes.</text>
    <text x="84" y="568" font-size="13" fill="#0E7C5B" font-style="italic">Status: enormous, consistent, unfalsifiable. The data we have, not the data we want.</text>

    <text x="600" y="528" font-family="'JetBrains Mono',monospace" font-size="11" fill="#0E7C5B" letter-spacing="1" text-anchor="middle">EVIDENCE</text>
    <text x="600" y="560" font-family="'Instrument Serif',Georgia,serif" font-size="48" fill="#0E7C5B" text-anchor="middle">●●●</text>
    <text x="600" y="576" font-family="'JetBrains Mono',monospace" font-size="10" fill="#0E7C5B" text-anchor="middle" letter-spacing="0.5">ABUNDANT</text>
  </g>
  <line x1="60" y1="584" x2="760" y2="584" stroke="#DDD5C2" stroke-width="1"/>

  <!-- BOTTOM TAKEAWAY -->
  <text x="410" y="618" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#4C5563" text-anchor="middle">"Abundant testimony is not proof. Absence of RCTs is not refutation."</text>
  <text x="410" y="642" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8A93A2" text-anchor="middle" letter-spacing="2">─ THE EPISTEMOLOGY OF SUBJECTIVE TOOLS ─</text>
</svg>
