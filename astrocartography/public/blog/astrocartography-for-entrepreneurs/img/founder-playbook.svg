<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-fp d-fp">
  <title id="t-fp">A founder's astrocartography playbook by business stage</title>
  <desc id="d-fp">Matching business stage to a line. Build and ship stage: Mars or Saturn line for focus and output. Launch and growth: Jupiter or Midheaven line for visibility and opportunity. Raise and lead: Sun or Midheaven line for confidence and authority. Reset and recover: Moon or IC line for rest between sprints.</desc>

  <rect width="820" height="420" fill="#FBF8F1"/>
  <text x="40" y="48" font-family="'Instrument Serif',Georgia,serif" font-size="28" fill="#181C23">Match the line to the stage you're in</text>
  <text x="40" y="73" font-size="13" fill="#4C5563">A practical playbook — choose your base for the season your business is actually in.</text>

  <!-- 4 stage rows -->
  <g>
    <rect x="40" y="92" width="740" height="68" rx="14" fill="#FFFFFF" stroke="#E7E0D1"/>
    <text x="64" y="124" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2">STAGE 01</text>
    <text x="64" y="146" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">Build &amp; ship</text>
    <text x="420" y="128" font-size="14" fill="#181C23" font-weight="600">Mars / Saturn line</text>
    <text x="420" y="148" font-size="12.5" fill="#4C5563">Low distraction, high output — head-down focus to ship.</text>

    <rect x="40" y="170" width="740" height="68" rx="14" fill="#FFFFFF" stroke="#E7E0D1"/>
    <text x="64" y="202" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2">STAGE 02</text>
    <text x="64" y="224" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">Launch &amp; grow</text>
    <text x="420" y="206" font-size="14" fill="#A8650F" font-weight="600">Jupiter / Midheaven line</text>
    <text x="420" y="226" font-size="12.5" fill="#4C5563">Visibility and opportunity — where launches land and reach.</text>

    <rect x="40" y="248" width="740" height="68" rx="14" fill="#FFFFFF" stroke="#E7E0D1"/>
    <text x="64" y="280" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2">STAGE 03</text>
    <text x="64" y="302" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#181C23">Raise &amp; lead</text>
    <text x="420" y="284" font-size="14" fill="#A8650F" font-weight="600">Sun / Midheaven line</text>
    <text x="420" y="304" font-size="12.5" fill="#4C5563">Confidence and authority — show up as the founder in the room.</text>

    <rect x="40" y="326" width="740" height="68" rx="14" fill="#0B1118"/>
    <text x="64" y="358" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2">STAGE 04</text>
    <text x="64" y="380" font-family="'Instrument Serif',Georgia,serif" font-size="19" fill="#EAF2EE">Reset &amp; recover</text>
    <text x="420" y="362" font-size="14" fill="#19C68B" font-weight="600">Moon / IC line</text>
    <text x="420" y="382" font-size="12.5" fill="#C2CDC8">Rest between sprints — refill before the next push.</text>
  </g>
</svg>
