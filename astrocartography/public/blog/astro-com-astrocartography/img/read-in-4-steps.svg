<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-rs d-rs">
  <title id="t-rs">How to read the Astro.com AstroClickTravel map in four steps</title>
  <desc id="d-rs">Four-step guide to reading the Astro.com astrocartography map: 1 enter exact birth data, 2 open AstroClickTravel and load the world map, 3 identify the four line types ascendant descendant midheaven imum coeli, 4 read planet plus angle together. Astro.com shows a flat 2D Mercator map; a 3D globe removes the polar distortion.</desc>

  <rect width="820" height="480" fill="#FBF8F1"/>
  <text x="48" y="56" font-family="'Instrument Serif',Georgia,serif" font-size="30" fill="#181C23">Reading the Astro.com map, in four steps</text>
  <text x="48" y="84" font-size="13.5" fill="#4C5563">AstroClickTravel renders a flat 2D Mercator map — workable once you know where to look.</text>

  <!-- Step 1 -->
  <rect x="48" y="108" width="350" height="150" rx="16" fill="#FFFFFF" stroke="#E7E0D1"/>
  <circle cx="80" cy="140" r="15" fill="#5D4FB8"/><text x="80" y="145" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="106" y="138" font-family="'Instrument Serif',Georgia,serif" font-size="20" fill="#181C23">Enter exact birth data</text>
  <text x="72" y="170" font-size="13.5" fill="#4C5563">Date, <tspan font-weight="600" fill="#181C23">exact time</tspan>, and city. A 4-minute</text>
  <text x="72" y="190" font-size="13.5" fill="#4C5563">error can shift a line ~1° — about</text>
  <text x="72" y="210" font-size="13.5" fill="#4C5563">100 km on the ground. Time matters.</text>
  <text x="72" y="236" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2">Extended Chart Selection → AstroClickTravel</text>

  <!-- Step 2 -->
  <rect x="422" y="108" width="350" height="150" rx="16" fill="#FFFFFF" stroke="#E7E0D1"/>
  <circle cx="454" cy="140" r="15" fill="#0E7C5B"/><text x="454" y="145" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="480" y="138" font-family="'Instrument Serif',Georgia,serif" font-size="20" fill="#181C23">Load the world map</text>
  <text x="446" y="170" font-size="13.5" fill="#4C5563">You get a Mercator projection with</text>
  <text x="446" y="190" font-size="13.5" fill="#4C5563">coloured planetary lines. Click any</text>
  <text x="446" y="210" font-size="13.5" fill="#4C5563">point to see which lines run nearby.</text>
  <text x="446" y="236" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8A93A2">Tip: zoom in — lines crowd near the equator</text>

  <!-- Step 3 -->
  <rect x="48" y="278" width="350" height="160" rx="16" fill="#FFFFFF" stroke="#E7E0D1"/>
  <circle cx="80" cy="310" r="15" fill="#A8650F"/><text x="80" y="315" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="106" y="308" font-family="'Instrument Serif',Georgia,serif" font-size="20" fill="#181C23">Know the four line types</text>
  <text x="72" y="340" font-size="13.5" fill="#181C23"><tspan font-weight="600" fill="#A8650F">AC</tspan> rising · how a place makes you feel</text>
  <text x="72" y="362" font-size="13.5" fill="#181C23"><tspan font-weight="600" fill="#A8650F">DC</tspan> setting · relationships &amp; others</text>
  <text x="72" y="384" font-size="13.5" fill="#181C23"><tspan font-weight="600" fill="#A8650F">MC</tspan> culminating · career &amp; visibility</text>
  <text x="72" y="406" font-size="13.5" fill="#181C23"><tspan font-weight="600" fill="#A8650F">IC</tspan> bottom · home &amp; roots</text>

  <!-- Step 4 -->
  <rect x="422" y="278" width="350" height="160" rx="16" fill="#0B1118"/>
  <circle cx="454" cy="310" r="15" fill="#19C68B"/><text x="454" y="315" font-size="15" font-weight="700" fill="#06241A" text-anchor="middle">4</text>
  <text x="480" y="308" font-family="'Instrument Serif',Georgia,serif" font-size="20" fill="#EAF2EE">Read planet + angle together</text>
  <text x="446" y="340" font-size="13.5" fill="#C2CDC8">Venus + DC = warmth in partnership.</text>
  <text x="446" y="362" font-size="13.5" fill="#C2CDC8">Sun + MC = visibility, recognition.</text>
  <text x="446" y="384" font-size="13.5" fill="#C2CDC8">Saturn + AC = pressure, but mastery.</text>
  <text x="446" y="414" font-size="12.5" font-style="italic" fill="#19C68B">A globe removes the Mercator distortion entirely.</text>
</svg>
