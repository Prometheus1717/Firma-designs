<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 880" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-mr d-mr">
  <title id="t-mr">7 Common Astrocartography Myths vs. Reality</title>
  <desc id="d-mr">A side-by-side debunking of seven persistent astrocartography myths: that Sun lines make you famous, that Pluto lines are dangerous, that astrocartography is scientifically proven, that the Sun line is always strongest, that lines are felt instantly, that astrocartography contradicts natal charts, and that more lines means more effect.</desc>

  <rect width="820" height="880" fill="#FBF8F1"/>

  <defs>
    <radialGradient id="aurora-mr" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#B2543F" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#B2543F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="180" fill="url(#aurora-mr)"/>

  <text x="410" y="46" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="4">★  MYTH vs. REALITY  ★</text>

  <text x="410" y="98" font-family="'Instrument Serif',Georgia,serif" font-size="38" fill="#181C23" text-anchor="middle">Seven things <tspan font-style="italic" fill="#4C5563">everyone gets wrong.</tspan></text>
  <text x="410" y="132" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#8A93A2" text-anchor="middle">The persistent misconceptions, calmly corrected.</text>

  <!-- HEADER ROW -->
  <line x1="40" y1="190" x2="780" y2="190" stroke="#DDD5C2" stroke-width="1"/>
  <text x="220" y="214" font-family="'JetBrains Mono',monospace" font-size="11" fill="#B2543F" letter-spacing="2" text-anchor="middle">THE MYTH</text>
  <text x="600" y="214" font-family="'JetBrains Mono',monospace" font-size="11" fill="#0E7C5B" letter-spacing="2" text-anchor="middle">THE REALITY</text>
  <line x1="40" y1="226" x2="780" y2="226" stroke="#181C23" stroke-width="1.2"/>

  <!-- MYTH 1 -->
  <rect x="40" y="230" width="740" height="84" fill="#FFFFFF"/>
  <text x="58" y="252" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8A93A2" letter-spacing="1.5">[01]</text>
  <text x="58" y="278" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#B2543F">"Move to a Sun line, become famous."</text>
  <text x="58" y="300" font-size="13" fill="#4C5563">Sun lines amplify what you already do — they do not invent talent or work ethic.</text>
  <line x1="40" y1="314" x2="780" y2="314" stroke="#E7E0D1" stroke-width="1"/>

  <!-- MYTH 2 -->
  <rect x="40" y="316" width="740" height="84" fill="#FBF8F1"/>
  <text x="58" y="338" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8A93A2" letter-spacing="1.5">[02]</text>
  <text x="58" y="364" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#B2543F">"The Pluto line is dangerous."</text>
  <text x="58" y="386" font-size="13" fill="#4C5563">Intense, not dangerous. It demands transformation, which the unprepared experience as crisis.</text>
  <line x1="40" y1="400" x2="780" y2="400" stroke="#E7E0D1" stroke-width="1"/>

  <!-- MYTH 3 -->
  <rect x="40" y="402" width="740" height="84" fill="#FFFFFF"/>
  <text x="58" y="424" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8A93A2" letter-spacing="1.5">[03]</text>
  <text x="58" y="450" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#B2543F">"Astrocartography is scientifically proven."</text>
  <text x="58" y="472" font-size="13" fill="#4C5563">Astronomically yes; interpretively no. Zero double-blind RCTs exist either way.</text>
  <line x1="40" y1="486" x2="780" y2="486" stroke="#E7E0D1" stroke-width="1"/>

  <!-- MYTH 4 -->
  <rect x="40" y="488" width="740" height="84" fill="#FBF8F1"/>
  <text x="58" y="510" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8A93A2" letter-spacing="1.5">[04]</text>
  <text x="58" y="536" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#B2543F">"Your Sun line is always the strongest."</text>
  <text x="58" y="558" font-size="13" fill="#4C5563">Only when it passes near you. A close Pluto line beats a distant Sun line every time.</text>
  <line x1="40" y1="572" x2="780" y2="572" stroke="#E7E0D1" stroke-width="1"/>

  <!-- MYTH 5 -->
  <rect x="40" y="574" width="740" height="84" fill="#FFFFFF"/>
  <text x="58" y="596" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8A93A2" letter-spacing="1.5">[05]</text>
  <text x="58" y="622" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#B2543F">"You feel a line the moment you arrive."</text>
  <text x="58" y="644" font-size="13" fill="#4C5563">Personal planets within weeks. Outer planets take months to register clearly.</text>
  <line x1="40" y1="658" x2="780" y2="658" stroke="#E7E0D1" stroke-width="1"/>

  <!-- MYTH 6 -->
  <rect x="40" y="660" width="740" height="84" fill="#FBF8F1"/>
  <text x="58" y="682" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8A93A2" letter-spacing="1.5">[06]</text>
  <text x="58" y="708" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#B2543F">"Astrocartography contradicts your natal chart."</text>
  <text x="58" y="730" font-size="13" fill="#4C5563">No — it amplifies one part of an already-existing natal chart, never adds something foreign.</text>
  <line x1="40" y1="744" x2="780" y2="744" stroke="#E7E0D1" stroke-width="1"/>

  <!-- MYTH 7 (last, dark) -->
  <rect x="40" y="746" width="740" height="84" fill="#0B1118"/>
  <text x="58" y="768" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8A93A2" letter-spacing="1.5">[07]</text>
  <text x="58" y="794" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" fill="#B2543F">"More lines near you means more effect."</text>
  <text x="58" y="816" font-size="13" fill="#C8D8E8">One strong close line beats five weak distant lines. Proximity dominates count.</text>

  <text x="410" y="860" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="14" text-anchor="middle" fill="#8A93A2">"The map amplifies. It does not invent."</text>
</svg>
