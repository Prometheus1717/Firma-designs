<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-sh d-sh">
  <title id="t-sh">Astrocartography Line Strength Hierarchy — Three Factors That Decide Yours</title>
  <desc id="d-sh">Three factors decide which astrocartography line is strongest for you personally: (1) planetary archetype hierarchy with Sun and Moon at the top, (2) proximity orb measured in kilometers from the line, (3) angle weight with MC and IC slightly stronger than ASC and DC. Your strongest line is the highest-ranked planet whose line passes within 500 kilometers.</desc>

  <rect width="820" height="620" fill="#FBF8F1"/>

  <defs>
    <radialGradient id="aurora-sh" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#5D4FB8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5D4FB8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="180" fill="url(#aurora-sh)"/>

  <text x="410" y="46" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="4">★  THREE FACTORS  ★</text>

  <text x="410" y="98" font-family="'Instrument Serif',Georgia,serif" font-size="38" fill="#181C23" text-anchor="middle">Which line is <tspan font-style="italic" fill="#4C5563">strongest?</tspan></text>
  <text x="410" y="132" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#8A93A2" text-anchor="middle">Three factors multiply together — not one alone.</text>

  <line x1="60" y1="190" x2="760" y2="190" stroke="#DDD5C2" stroke-width="1"/>

  <!-- Factor 1: Archetype rank -->
  <g>
    <rect x="40" y="210" width="240" height="370" rx="22" fill="#FFFFFF" stroke="#FAEBD2" stroke-width="2"/>
    <text x="160" y="240" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#A8650F" letter-spacing="2">─── FACTOR 01 ───</text>
    <text x="160" y="272" font-family="'Instrument Serif',Georgia,serif" font-size="22" text-anchor="middle" fill="#181C23">Archetype rank</text>
    <text x="160" y="294" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="13" text-anchor="middle" fill="#A8650F">which planet</text>

    <g font-family="'Instrument Serif',Georgia,serif" font-size="17" fill="#181C23">
      <text x="60" y="334"><tspan fill="#A8650F" font-size="20">☉</tspan>  Sun</text>
      <text x="220" y="334" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#A8650F">10</text>

      <text x="60" y="362"><tspan fill="#5D4FB8" font-size="20">☽</tspan>  Moon</text>
      <text x="220" y="362" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#5D4FB8">9</text>

      <text x="60" y="390"><tspan fill="#B2543F" font-size="20">♇</tspan>  Pluto</text>
      <text x="220" y="390" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#B2543F">8</text>

      <text x="60" y="418"><tspan fill="#A8650F" font-size="20">♃</tspan>  Jupiter</text>
      <text x="220" y="418" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#A8650F">7</text>

      <text x="60" y="446"><tspan fill="#4C5563" font-size="20">♄</tspan>  Saturn</text>
      <text x="220" y="446" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#4C5563">7</text>

      <text x="60" y="474"><tspan fill="#5D4FB8" font-size="20">♅</tspan>  Uranus</text>
      <text x="220" y="474" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#5D4FB8">6</text>

      <text x="60" y="502"><tspan fill="#5D4FB8" font-size="20">♆</tspan>  Neptune</text>
      <text x="220" y="502" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#5D4FB8">6</text>

      <text x="60" y="530"><tspan fill="#B2543F" font-size="20">♂</tspan>  Mars</text>
      <text x="220" y="530" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#B2543F">5</text>

      <text x="60" y="558"><tspan fill="#B2543F" font-size="20">♀</tspan>  Venus / <tspan fill="#0E7C5B" font-size="20">☿</tspan>  Mercury</text>
      <text x="220" y="558" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#4C5563">4</text>
    </g>
  </g>

  <!-- Factor 2: Proximity -->
  <g>
    <rect x="290" y="210" width="240" height="370" rx="22" fill="#FFFFFF" stroke="#DCF2E5" stroke-width="2"/>
    <text x="410" y="240" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#0E7C5B" letter-spacing="2">─── FACTOR 02 ───</text>
    <text x="410" y="272" font-family="'Instrument Serif',Georgia,serif" font-size="22" text-anchor="middle" fill="#181C23">Proximity</text>
    <text x="410" y="294" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="13" text-anchor="middle" fill="#0E7C5B">how close to you</text>

    <g font-family="'Instrument Serif',Georgia,serif" font-size="16" fill="#181C23">
      <text x="310" y="338"><tspan fill="#0E7C5B" font-size="18">●</tspan>  On the line</text>
      <text x="510" y="338" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="end" fill="#0E7C5B">100 %</text>

      <text x="310" y="366"><tspan fill="#0E7C5B" font-size="18">●</tspan>  Under 250 km</text>
      <text x="510" y="366" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="end" fill="#0E7C5B">90 %</text>

      <text x="310" y="394"><tspan fill="#A8650F" font-size="18">●</tspan>  250 – 500 km</text>
      <text x="510" y="394" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="end" fill="#A8650F">70 %</text>

      <text x="310" y="422"><tspan fill="#A8650F" font-size="18">●</tspan>  500 – 700 km</text>
      <text x="510" y="422" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="end" fill="#A8650F">45 %</text>

      <text x="310" y="450"><tspan fill="#B2543F" font-size="18">●</tspan>  700 – 1000 km</text>
      <text x="510" y="450" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="end" fill="#B2543F">20 %</text>

      <text x="310" y="478"><tspan fill="#B2543F" font-size="18">○</tspan>  &gt; 1000 km</text>
      <text x="510" y="478" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="end" fill="#B2543F">~ 0 %</text>
    </g>

    <text x="310" y="520" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="13" fill="#0E7C5B">Outer planets</text>
    <text x="310" y="538" font-size="12" fill="#4C5563">(Jupiter → Pluto) reach</text>
    <text x="310" y="554" font-size="12" fill="#4C5563">further. Add 200 km</text>
    <text x="310" y="570" font-size="12" fill="#4C5563">to each tier above.</text>
  </g>

  <!-- Factor 3: Angle weight -->
  <g>
    <rect x="540" y="210" width="240" height="370" rx="22" fill="#FFFFFF" stroke="#E9E5F9" stroke-width="2"/>
    <text x="660" y="240" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#5D4FB8" letter-spacing="2">─── FACTOR 03 ───</text>
    <text x="660" y="272" font-family="'Instrument Serif',Georgia,serif" font-size="22" text-anchor="middle" fill="#181C23">Angle weight</text>
    <text x="660" y="294" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="13" text-anchor="middle" fill="#5D4FB8">which angle</text>

    <g font-family="'Instrument Serif',Georgia,serif" font-size="17" fill="#181C23">
      <text x="560" y="340"><tspan fill="#5D4FB8" font-style="italic">MC</tspan>  Midheaven</text>
      <text x="760" y="340" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#5D4FB8">1.0 ×</text>
      <text x="560" y="362" font-size="12" fill="#8A93A2">career, recognition</text>

      <text x="560" y="396"><tspan fill="#5D4FB8" font-style="italic">IC</tspan>  Nadir</text>
      <text x="760" y="396" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#5D4FB8">1.0 ×</text>
      <text x="560" y="418" font-size="12" fill="#8A93A2">home, roots</text>

      <text x="560" y="452"><tspan fill="#5D4FB8" font-style="italic">ASC</tspan>  Ascendant</text>
      <text x="760" y="452" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#5D4FB8">0.85 ×</text>
      <text x="560" y="474" font-size="12" fill="#8A93A2">identity, vitality</text>

      <text x="560" y="508"><tspan fill="#5D4FB8" font-style="italic">DC</tspan>  Descendant</text>
      <text x="760" y="508" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="end" fill="#5D4FB8">0.85 ×</text>
      <text x="560" y="530" font-size="12" fill="#8A93A2">partners, others</text>
    </g>

    <text x="660" y="560" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="13" text-anchor="middle" fill="#5D4FB8">MC/IC are slightly</text>
    <text x="660" y="576" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="13" text-anchor="middle" fill="#5D4FB8">stronger by tradition.</text>
  </g>

  <text x="410" y="608" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="14" text-anchor="middle" fill="#8A93A2">strength = archetype rank × proximity % × angle weight</text>
</svg>
