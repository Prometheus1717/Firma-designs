<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-mvg d-mvg">
  <title id="t-mvg">2D Flat Map vs. 3D Globe — How Astrocartography Calculators Render Lines</title>
  <desc id="d-mvg">Side-by-side comparison of how astrocartography calculators visualise planetary lines: the old 2D Mercator map (used by AstroSeek, Astro.com) distorts polar lines and forces mental rotation, while a 3D globe (used by Natal Navigator) shows true geography and allows intuitive line-following from any angle.</desc>

  <rect width="820" height="580" fill="#FBF8F1"/>

  <defs>
    <radialGradient id="aurora-mvg" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#5D4FB8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5D4FB8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="180" fill="url(#aurora-mvg)"/>

  <text x="410" y="46" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="4">★  THE RENDERING QUESTION  ★</text>

  <text x="410" y="98" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#181C23" text-anchor="middle">Flat map, or <tspan font-style="italic" fill="#4C5563">round Earth?</tspan></text>
  <text x="410" y="128" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#8A93A2" text-anchor="middle">The single technical decision that defines an astrocartography tool.</text>

  <!-- LEFT: 2D Flat Map -->
  <g>
    <rect x="40" y="170" width="350" height="320" rx="22" fill="#FFFFFF" stroke="#E7E0D1" stroke-width="1"/>

    <text x="215" y="200" font-family="'JetBrains Mono',monospace" font-size="10.5" text-anchor="middle" fill="#A8650F" letter-spacing="2">─── 2D FLAT MAP ───</text>
    <text x="215" y="230" font-family="'Instrument Serif',Georgia,serif" font-size="22" text-anchor="middle" fill="#181C23">The legacy approach</text>
    <text x="215" y="252" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="13" text-anchor="middle" fill="#8A93A2">Mercator projection, paper-print roots</text>

    <!-- Simple flat map mockup -->
    <rect x="80" y="276" width="270" height="130" rx="6" fill="#F4EFE3" stroke="#DDD5C2"/>
    <!-- continents abstracted -->
    <path d="M 100 320 Q 130 305 165 318 T 215 322 L 230 340 Q 200 350 165 348 T 100 340 Z" fill="#E7E0D1"/>
    <path d="M 240 300 Q 270 290 305 305 T 340 320 L 330 365 Q 290 370 250 360 Z" fill="#E7E0D1"/>
    <!-- planetary lines (vertical) -->
    <line x1="120" y1="276" x2="120" y2="406" stroke="#A8650F" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="178" y1="276" x2="178" y2="406" stroke="#B2543F" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="245" y1="276" x2="245" y2="406" stroke="#5D4FB8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="310" y1="276" x2="310" y2="406" stroke="#0E7C5B" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- polar distortion warning -->
    <line x1="80" y1="285" x2="350" y2="285" stroke="#B2543F" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="80" y1="395" x2="350" y2="395" stroke="#B2543F" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="215" y="282" font-family="'JetBrains Mono',monospace" font-size="8" text-anchor="middle" fill="#B2543F" letter-spacing="0.5">↑ distorted polar zone</text>

    <text x="60" y="430" font-family="'JetBrains Mono',monospace" font-size="10" fill="#A8650F" letter-spacing="1">PROS</text>
    <text x="60" y="448" font-size="12.5" fill="#181C23">Familiar · prints well · fast</text>

    <text x="60" y="470" font-family="'JetBrains Mono',monospace" font-size="10" fill="#B2543F" letter-spacing="1">CONS</text>
    <text x="60" y="488" font-size="12.5" fill="#181C23">Polar distortion · no rotation · static</text>
  </g>

  <!-- ARROW -->
  <text x="410" y="340" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="32" text-anchor="middle" fill="#8A93A2">→</text>

  <!-- RIGHT: 3D Globe -->
  <g>
    <rect x="430" y="170" width="350" height="320" rx="22" fill="#0B1118"/>

    <text x="605" y="200" font-family="'JetBrains Mono',monospace" font-size="10.5" text-anchor="middle" fill="#19C68B" letter-spacing="2">─── 3D GLOBE ───</text>
    <text x="605" y="230" font-family="'Instrument Serif',Georgia,serif" font-size="22" text-anchor="middle" fill="#EAF2EE">The 2026 standard</text>
    <text x="605" y="252" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="13" text-anchor="middle" fill="#8A93A2">True spherical geometry, rotatable</text>

    <!-- Globe mockup -->
    <circle cx="605" cy="342" r="68" fill="#101826" stroke="#1A2840"/>
    <!-- meridians -->
    <ellipse cx="605" cy="342" rx="22" ry="68" fill="none" stroke="#2A3850" stroke-width="0.8"/>
    <ellipse cx="605" cy="342" rx="45" ry="68" fill="none" stroke="#2A3850" stroke-width="0.6"/>
    <!-- parallels -->
    <ellipse cx="605" cy="342" rx="68" ry="22" fill="none" stroke="#2A3850" stroke-width="0.6"/>
    <ellipse cx="605" cy="342" rx="68" ry="45" fill="none" stroke="#2A3850" stroke-width="0.5"/>
    <!-- continents (abstracted) -->
    <path d="M 580 320 Q 595 310 615 320 Q 625 332 615 345 Q 595 348 580 340 Z" fill="#1A2840" opacity="0.85"/>
    <path d="M 625 350 Q 640 348 645 360 Q 642 372 628 370 Z" fill="#1A2840" opacity="0.85"/>
    <!-- curved planetary lines (true 3D arcs) -->
    <path d="M 545 320 Q 605 332 665 360" stroke="#19C68B" stroke-width="2" fill="none"/>
    <path d="M 548 360 Q 605 348 660 320" stroke="#FACC15" stroke-width="1.8" fill="none"/>
    <path d="M 555 305 Q 605 360 655 380" stroke="#F04060" stroke-width="1.6" fill="none"/>
    <!-- glow dots = cities -->
    <circle cx="588" cy="335" r="2.5" fill="#19C68B"/>
    <circle cx="630" cy="360" r="2.5" fill="#FACC15"/>
    <circle cx="610" cy="320" r="2" fill="#F04060"/>

    <text x="450" y="430" font-family="'JetBrains Mono',monospace" font-size="10" fill="#19C68B" letter-spacing="1">PROS</text>
    <text x="450" y="448" font-size="12.5" fill="#EAF2EE">True geography · rotate · zoom · intuitive</text>

    <text x="450" y="470" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8A93A2" letter-spacing="1">CONS</text>
    <text x="450" y="488" font-size="12.5" fill="#EAF2EE">Needs WebGL · slightly heavier</text>
  </g>

  <!-- BOTTOM CONCLUSION -->
  <rect x="40" y="510" width="740" height="50" rx="14" fill="#DCF2E5"/>
  <text x="60" y="535" font-family="'JetBrains Mono',monospace" font-size="11" fill="#0E7C5B" letter-spacing="2">VERDICT</text>
  <text x="135" y="535" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="16" fill="#06241A">3D globes have won the 2026 standard.</text>
  <text x="60" y="552" font-size="12.5" fill="#181C23">Only Natal Navigator and TimePassages currently render planetary lines in true sphere — and only Natal Navigator does it in-browser.</text>
</svg>
