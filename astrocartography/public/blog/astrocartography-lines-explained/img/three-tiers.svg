<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-tiers d-tiers">
  <title id="t-tiers">The Three Tiers of Planetary Lines — Luminaries, Personals, Outers</title>
  <desc id="d-tiers">Astrocartography lines are grouped into three tiers: Luminaries (Sun and Moon) shape core identity and emotional life, Personal Planets (Mercury, Venus, Mars) shape daily behavior and relationships, Outer Planets (Jupiter, Saturn, Uranus, Neptune, Pluto) shape generational and transformational energies.</desc>
  <rect width="820" height="580" fill="#FBF8F1"/>

  <defs>
    <radialGradient id="glow-t" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#5D4FB8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5D4FB8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="220" fill="url(#glow-t)"/>

  <!-- Editorial header -->
  <text x="410" y="38" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="3">★  THREE TIERS OF THE PANTHEON  ★</text>

  <text x="410" y="78" font-family="'Instrument Serif',Georgia,serif" font-size="32" font-weight="400" fill="#181C23" text-anchor="middle">Not all lines carry equal <tspan font-style="italic" fill="#4C5563">weight</tspan></text>
  <text x="410" y="104" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#4C5563" text-anchor="middle">Read your Sun line first. Read your Pluto line last.</text>

  <!-- Tier 1: Luminaries (warm amber) -->
  <g>
    <rect x="40" y="140" width="240" height="380" rx="22" fill="#FFFFFF" stroke="#FAEBD2" stroke-width="2"/>
    <text x="160" y="172" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#A8650F" letter-spacing="2">─── TIER 1 ───</text>
    <text x="160" y="208" font-family="'Instrument Serif',Georgia,serif" font-size="30" text-anchor="middle" fill="#181C23">Luminaries</text>
    <text x="160" y="230" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="14" text-anchor="middle" fill="#A8650F">read these first</text>

    <text x="160" y="294" font-family="'Instrument Serif',Georgia,serif" font-size="44" text-anchor="middle" fill="#A8650F">☉  ☽</text>

    <text x="160" y="334" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" text-anchor="middle" fill="#181C23">Sun · Moon</text>

    <text x="60" y="370" font-size="12.5" fill="#4C5563">Strongest pull on identity and</text>
    <text x="60" y="388" font-size="12.5" fill="#4C5563">emotional life. The two lights</text>
    <text x="60" y="406" font-size="12.5" fill="#4C5563">of the chart.</text>

    <text x="60" y="436" font-family="'JetBrains Mono',monospace" font-size="10" fill="#A8650F" letter-spacing="1.5">FELT AS</text>
    <text x="60" y="452" font-size="12.5" fill="#181C23">core self · home · vitality</text>

    <text x="60" y="478" font-family="'JetBrains Mono',monospace" font-size="10" fill="#A8650F" letter-spacing="1.5">RADIUS</text>
    <text x="60" y="494" font-size="12.5" fill="#181C23">~700 km from the line</text>
  </g>

  <!-- Tier 2: Personals (mint) -->
  <g>
    <rect x="290" y="140" width="240" height="380" rx="22" fill="#FFFFFF" stroke="#DCF2E5" stroke-width="2"/>
    <text x="410" y="172" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#0E7C5B" letter-spacing="2">─── TIER 2 ───</text>
    <text x="410" y="208" font-family="'Instrument Serif',Georgia,serif" font-size="30" text-anchor="middle" fill="#181C23">Personals</text>
    <text x="410" y="230" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="14" text-anchor="middle" fill="#0E7C5B">daily behavior</text>

    <text x="410" y="294" font-family="'Instrument Serif',Georgia,serif" font-size="40" text-anchor="middle" fill="#0E7C5B">☿  ♀  ♂</text>

    <text x="410" y="334" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" text-anchor="middle" fill="#181C23">Mercury · Venus · Mars</text>

    <text x="310" y="370" font-size="12.5" fill="#4C5563">Shape thought, love and action.</text>
    <text x="310" y="388" font-size="12.5" fill="#4C5563">Subtle daily energies felt in</text>
    <text x="310" y="406" font-size="12.5" fill="#4C5563">routines.</text>

    <text x="310" y="436" font-family="'JetBrains Mono',monospace" font-size="10" fill="#0E7C5B" letter-spacing="1.5">FELT AS</text>
    <text x="310" y="452" font-size="12.5" fill="#181C23">words · love · drive</text>

    <text x="310" y="478" font-family="'JetBrains Mono',monospace" font-size="10" fill="#0E7C5B" letter-spacing="1.5">RADIUS</text>
    <text x="310" y="494" font-size="12.5" fill="#181C23">~500 km from the line</text>
  </g>

  <!-- Tier 3: Outers (lavender) -->
  <g>
    <rect x="540" y="140" width="240" height="380" rx="22" fill="#FFFFFF" stroke="#E9E5F9" stroke-width="2"/>
    <text x="660" y="172" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#5D4FB8" letter-spacing="2">─── TIER 3 ───</text>
    <text x="660" y="208" font-family="'Instrument Serif',Georgia,serif" font-size="30" text-anchor="middle" fill="#181C23">Outers</text>
    <text x="660" y="230" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="14" text-anchor="middle" fill="#5D4FB8">transformation</text>

    <text x="660" y="294" font-family="'Instrument Serif',Georgia,serif" font-size="34" text-anchor="middle" fill="#5D4FB8">♃ ♄ ♅ ♆ ♇</text>

    <text x="660" y="334" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="17" text-anchor="middle" fill="#181C23">Jupiter → Pluto</text>

    <text x="560" y="370" font-size="12.5" fill="#4C5563">Generational and life-shaping.</text>
    <text x="560" y="388" font-size="12.5" fill="#4C5563">Slow, deep, often unforgettable,</text>
    <text x="560" y="406" font-size="12.5" fill="#4C5563">sometimes brutal.</text>

    <text x="560" y="436" font-family="'JetBrains Mono',monospace" font-size="10" fill="#5D4FB8" letter-spacing="1.5">FELT AS</text>
    <text x="560" y="452" font-size="12.5" fill="#181C23">fate · rupture · rebirth</text>

    <text x="560" y="478" font-family="'JetBrains Mono',monospace" font-size="10" fill="#5D4FB8" letter-spacing="1.5">RADIUS</text>
    <text x="560" y="494" font-size="12.5" fill="#181C23">~800–1000 km from the line</text>
  </g>

  <!-- Bottom note -->
  <text x="410" y="555" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="14" text-anchor="middle" fill="#8A93A2">Read your chart in this order. Skip a tier and you misread the whole map.</text>
</svg>
