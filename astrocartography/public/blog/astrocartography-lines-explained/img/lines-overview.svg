<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-lines d-lines">
  <title id="t-lines">The 10 Astrocartography Lines — Planetary Pantheon Overview</title>
  <desc id="d-lines">Complete overview of the ten astrocartography lines: Sun (Apollo), Moon (Selene), Mercury (Hermes), Venus (Aphrodite), Mars (Ares), Jupiter (Zeus), Saturn (Cronos), Uranus, Neptune (Poseidon), Pluto (Hades). Each line carries its planetary energy across the globe with specific life themes.</desc>
  <rect width="820" height="820" fill="#FBF8F1"/>

  <!-- soft aurora glow -->
  <defs>
    <radialGradient id="glow1" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#5D4FB8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5D4FB8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="280" fill="url(#glow1)"/>

  <!-- Editorial header -->
  <g>
    <text x="410" y="38" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="3">★  THE TEN PLANETARY GATES  ★</text>
    <text x="410" y="60" font-size="13" text-anchor="middle" fill="#4C5563" letter-spacing="4">☉   ☽   ☿   ♀   ♂   ♃   ♄   ♅   ♆   ♇</text>
  </g>

  <text x="410" y="100" font-family="'Instrument Serif',Georgia,serif" font-size="32" font-weight="400" fill="#181C23" text-anchor="middle">The ten astrocartography lines</text>
  <text x="410" y="124" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#4C5563" text-anchor="middle">Each planet writes its mythology across the Earth.</text>

  <!-- Card 1: SUN -->
  <g>
    <rect x="40" y="155" width="240" height="130" rx="18" fill="#FFFFFF" stroke="#E7E0D1" stroke-width="1"/>
    <text x="60" y="180" font-family="'JetBrains Mono',monospace" font-size="10" fill="#A8650F" letter-spacing="1.5">[01] · APOLLO</text>
    <text x="60" y="218" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#181C23">☉ <tspan font-size="22" font-style="italic" fill="#4C5563">Sun</tspan></text>
    <text x="60" y="244" font-size="12" fill="#4C5563">Vitality, recognition,</text>
    <text x="60" y="260" font-size="12" fill="#4C5563">leadership. Where you</text>
    <text x="60" y="276" font-size="12" fill="#4C5563">shine and are seen.</text>
  </g>

  <!-- Card 2: MOON -->
  <g>
    <rect x="290" y="155" width="240" height="130" rx="18" fill="#FFFFFF" stroke="#E7E0D1" stroke-width="1"/>
    <text x="310" y="180" font-family="'JetBrains Mono',monospace" font-size="10" fill="#5D4FB8" letter-spacing="1.5">[02] · SELENE</text>
    <text x="310" y="218" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#181C23">☽ <tspan font-size="22" font-style="italic" fill="#4C5563">Moon</tspan></text>
    <text x="310" y="244" font-size="12" fill="#4C5563">Emotion, family,</text>
    <text x="310" y="260" font-size="12" fill="#4C5563">intuition. Where you</text>
    <text x="310" y="276" font-size="12" fill="#4C5563">feel emotionally at home.</text>
  </g>

  <!-- Card 3: MERCURY -->
  <g>
    <rect x="540" y="155" width="240" height="130" rx="18" fill="#FFFFFF" stroke="#E7E0D1" stroke-width="1"/>
    <text x="560" y="180" font-family="'JetBrains Mono',monospace" font-size="10" fill="#0E7C5B" letter-spacing="1.5">[03] · HERMES</text>
    <text x="560" y="218" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#181C23">☿ <tspan font-size="22" font-style="italic" fill="#4C5563">Mercury</tspan></text>
    <text x="560" y="244" font-size="12" fill="#4C5563">Communication, travel,</text>
    <text x="560" y="260" font-size="12" fill="#4C5563">ideas. Where your mind</text>
    <text x="560" y="276" font-size="12" fill="#4C5563">sharpens.</text>
  </g>

  <!-- Card 4: VENUS -->
  <g>
    <rect x="40" y="305" width="240" height="130" rx="18" fill="#FFFFFF" stroke="#E7E0D1" stroke-width="1"/>
    <text x="60" y="330" font-family="'JetBrains Mono',monospace" font-size="10" fill="#B2543F" letter-spacing="1.5">[04] · APHRODITE</text>
    <text x="60" y="368" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#181C23">♀ <tspan font-size="22" font-style="italic" fill="#4C5563">Venus</tspan></text>
    <text x="60" y="394" font-size="12" fill="#4C5563">Love, beauty,</text>
    <text x="60" y="410" font-size="12" fill="#4C5563">relationships. Where</text>
    <text x="60" y="426" font-size="12" fill="#4C5563">romance lives.</text>
  </g>

  <!-- Card 5: MARS -->
  <g>
    <rect x="290" y="305" width="240" height="130" rx="18" fill="#FFFFFF" stroke="#E7E0D1" stroke-width="1"/>
    <text x="310" y="330" font-family="'JetBrains Mono',monospace" font-size="10" fill="#B2543F" letter-spacing="1.5">[05] · ARES</text>
    <text x="310" y="368" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#181C23">♂ <tspan font-size="22" font-style="italic" fill="#4C5563">Mars</tspan></text>
    <text x="310" y="394" font-size="12" fill="#4C5563">Action, drive, conflict.</text>
    <text x="310" y="410" font-size="12" fill="#4C5563">Where ambition is fierce —</text>
    <text x="310" y="426" font-size="12" fill="#4C5563">tempers may flare.</text>
  </g>

  <!-- Card 6: JUPITER -->
  <g>
    <rect x="540" y="305" width="240" height="130" rx="18" fill="#FFFFFF" stroke="#E7E0D1" stroke-width="1"/>
    <text x="560" y="330" font-family="'JetBrains Mono',monospace" font-size="10" fill="#A8650F" letter-spacing="1.5">[06] · ZEUS</text>
    <text x="560" y="368" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#181C23">♃ <tspan font-size="22" font-style="italic" fill="#4C5563">Jupiter</tspan></text>
    <text x="560" y="394" font-size="12" fill="#4C5563">Expansion, luck, growth.</text>
    <text x="560" y="410" font-size="12" fill="#4C5563">Where opportunity</text>
    <text x="560" y="426" font-size="12" fill="#4C5563">multiplies.</text>
  </g>

  <!-- Card 7: SATURN -->
  <g>
    <rect x="40" y="455" width="240" height="130" rx="18" fill="#F4EFE3" stroke="#DDD5C2" stroke-width="1"/>
    <text x="60" y="480" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4C5563" letter-spacing="1.5">[07] · CRONOS</text>
    <text x="60" y="518" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#181C23">♄ <tspan font-size="22" font-style="italic" fill="#4C5563">Saturn</tspan></text>
    <text x="60" y="544" font-size="12" fill="#4C5563">Discipline, structure,</text>
    <text x="60" y="560" font-size="12" fill="#4C5563">lessons. Where time slows</text>
    <text x="60" y="576" font-size="12" fill="#4C5563">and mastery is forged.</text>
  </g>

  <!-- Card 8: URANUS -->
  <g>
    <rect x="290" y="455" width="240" height="130" rx="18" fill="#E9E5F9" stroke="#D4CCEF" stroke-width="1"/>
    <text x="310" y="480" font-family="'JetBrains Mono',monospace" font-size="10" fill="#5D4FB8" letter-spacing="1.5">[08] · CAELUS</text>
    <text x="310" y="518" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#181C23">♅ <tspan font-size="22" font-style="italic" fill="#4C5563">Uranus</tspan></text>
    <text x="310" y="544" font-size="12" fill="#4C5563">Awakening, rebellion,</text>
    <text x="310" y="560" font-size="12" fill="#4C5563">change. Where the</text>
    <text x="310" y="576" font-size="12" fill="#4C5563">unexpected hits.</text>
  </g>

  <!-- Card 9: NEPTUNE -->
  <g>
    <rect x="540" y="455" width="240" height="130" rx="18" fill="#E9E5F9" stroke="#D4CCEF" stroke-width="1"/>
    <text x="560" y="480" font-family="'JetBrains Mono',monospace" font-size="10" fill="#5D4FB8" letter-spacing="1.5">[09] · POSEIDON</text>
    <text x="560" y="518" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#181C23">♆ <tspan font-size="22" font-style="italic" fill="#4C5563">Neptune</tspan></text>
    <text x="560" y="544" font-size="12" fill="#4C5563">Dreams, spirituality,</text>
    <text x="560" y="560" font-size="12" fill="#4C5563">illusion. Where boundaries</text>
    <text x="560" y="576" font-size="12" fill="#4C5563">between worlds thin.</text>
  </g>

  <!-- Card 10: PLUTO (dark, framed like artifact) -->
  <g>
    <rect x="40" y="605" width="500" height="140" rx="18" fill="#0B1118"/>
    <text x="60" y="630" font-family="'JetBrains Mono',monospace" font-size="10" fill="#B2543F" letter-spacing="1.5">[10] · HADES</text>
    <text x="60" y="668" font-family="'Instrument Serif',Georgia,serif" font-size="36" fill="#EAF2EE">♇ <tspan font-size="22" font-style="italic" fill="#8A93A2">Pluto</tspan></text>
    <text x="60" y="696" font-size="13" fill="#C8D8E8">Transformation, power, depth — the death-and-rebirth line.</text>
    <text x="60" y="714" font-size="13" fill="#C8D8E8">Where the old self dissolves and something fiercer takes its place.</text>
    <text x="60" y="732" font-size="11" font-family="'JetBrains Mono',monospace" fill="#19C68B" letter-spacing="1.5">FOR: deep healing · total reinvention · shadow work</text>
  </g>

  <!-- CTA card -->
  <g>
    <rect x="550" y="605" width="230" height="140" rx="18" fill="#19C68B"/>
    <text x="665" y="635" font-family="'JetBrains Mono',monospace" font-size="10" fill="#06241A" text-anchor="middle" letter-spacing="2">⟨ NAVIGATOR ⟩</text>
    <text x="665" y="675" font-family="'Instrument Serif',Georgia,serif" font-size="26" fill="#06241A" text-anchor="middle" font-style="italic">Map yours.</text>
    <text x="665" y="704" font-size="13" fill="#06241A" text-anchor="middle">See your 10 lines on an</text>
    <text x="665" y="722" font-size="13" fill="#06241A" text-anchor="middle">interactive 3D globe — free.</text>
  </g>

  <!-- Footer note -->
  <text x="410" y="780" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="1.5">10 planets · 4 angles (MC · IC · AC · DC) · 40 lines per chart</text>
  <text x="410" y="804" font-family="'Instrument Serif',Georgia,serif" font-size="15" font-style="italic" text-anchor="middle" fill="#4C5563">Every line is a doorway. Most stay closed.</text>
</svg>
