<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 880" font-family="'General Sans',-apple-system,BlinkMacSystemFont,sans-serif" role="img" aria-labelledby="t-which d-which">
  <title id="t-which">If you seek X, look at this line — astrocartography planner's guide</title>
  <desc id="d-which">A clear two-column reference table matching life goals to astrocartography lines: career to Sun MC, love to Venus DC, healing to Moon IC, reinvention to Pluto, plus secondary lines for communication (Mercury), drive (Mars), mastery (Saturn) and abundance (Jupiter).</desc>

  <!-- warm paper bg -->
  <rect width="820" height="880" fill="#FBF8F1"/>

  <!-- subtle aurora glow at top -->
  <defs>
    <radialGradient id="aurora" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#5D4FB8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5D4FB8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="220" fill="url(#aurora)"/>

  <!-- ── HEADER ── -->
  <text x="410" y="56" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#8A93A2" letter-spacing="4">★  THE PLANNER'S GUIDE  ★</text>

  <text x="410" y="116" font-family="'Instrument Serif',Georgia,serif" font-size="44" font-weight="400" fill="#181C23" text-anchor="middle">If you seek <tspan font-style="italic" fill="#4C5563">X</tspan>,</text>
  <text x="410" y="158" font-family="'Instrument Serif',Georgia,serif" font-size="44" font-weight="400" fill="#181C23" text-anchor="middle">look at <tspan font-style="italic" fill="#4C5563">this line</tspan>.</text>

  <text x="410" y="196" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="16" fill="#8A93A2" text-anchor="middle">A planner's cheat sheet for the ten astrocartography lines.</text>

  <!-- ── PRIMARY SECTION HEADER ── -->
  <line x1="60" y1="246" x2="760" y2="246" stroke="#DDD5C2" stroke-width="1"/>
  <text x="60" y="270" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#8A93A2" letter-spacing="2.5">FOUR PRIMARY GOALS</text>
  <text x="760" y="270" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#8A93A2" letter-spacing="2.5" text-anchor="end">PRIMARY · ALTERNATIVE</text>

  <!-- ── PRIMARY ROW 1: Career ── -->
  <rect x="60" y="290" width="700" height="76" rx="0" fill="#FFFFFF"/>
  <text x="84" y="324" font-family="'Instrument Serif',Georgia,serif" font-size="26" font-style="italic" fill="#181C23">Career &amp; recognition</text>
  <text x="84" y="350" font-size="13" fill="#8A93A2">"Where will I be seen?"</text>

  <text x="500" y="324" font-family="'Instrument Serif',Georgia,serif" font-size="22" fill="#A8650F">Sun ☉</text>
  <rect x="555" y="306" width="48" height="22" rx="11" fill="#FAEBD2"/>
  <text x="579" y="321" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#A8650F" letter-spacing="0.5">MC</text>

  <text x="500" y="354" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#8A93A2">or</text>
  <text x="530" y="354" font-family="'Instrument Serif',Georgia,serif" font-size="18" fill="#A8650F">Jupiter ♃</text>
  <rect x="623" y="340" width="48" height="20" rx="10" fill="#FAEBD2"/>
  <text x="647" y="354" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" fill="#A8650F" letter-spacing="0.5">MC</text>

  <line x1="60" y1="368" x2="760" y2="368" stroke="#E7E0D1" stroke-width="1"/>

  <!-- ── PRIMARY ROW 2: Love ── -->
  <rect x="60" y="370" width="700" height="76" rx="0" fill="#FBF8F1"/>
  <text x="84" y="404" font-family="'Instrument Serif',Georgia,serif" font-size="26" font-style="italic" fill="#181C23">Love &amp; partnership</text>
  <text x="84" y="430" font-size="13" fill="#8A93A2">"Where will I meet them?"</text>

  <text x="500" y="404" font-family="'Instrument Serif',Georgia,serif" font-size="22" fill="#B2543F">Venus ♀</text>
  <rect x="582" y="386" width="48" height="22" rx="11" fill="#F9E3E0"/>
  <text x="606" y="401" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#B2543F" letter-spacing="0.5">DC</text>

  <text x="500" y="434" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#8A93A2">or</text>
  <text x="530" y="434" font-family="'Instrument Serif',Georgia,serif" font-size="18" fill="#B2543F">Moon ☽</text>
  <rect x="608" y="420" width="46" height="20" rx="10" fill="#F9E3E0"/>
  <text x="631" y="434" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" fill="#B2543F" letter-spacing="0.5">IC</text>

  <line x1="60" y1="448" x2="760" y2="448" stroke="#E7E0D1" stroke-width="1"/>

  <!-- ── PRIMARY ROW 3: Healing ── -->
  <rect x="60" y="450" width="700" height="76" rx="0" fill="#FFFFFF"/>
  <text x="84" y="484" font-family="'Instrument Serif',Georgia,serif" font-size="26" font-style="italic" fill="#181C23">Healing &amp; home</text>
  <text x="84" y="510" font-size="13" fill="#8A93A2">"Where will I feel safe?"</text>

  <text x="500" y="484" font-family="'Instrument Serif',Georgia,serif" font-size="22" fill="#0E7C5B">Moon ☽</text>
  <rect x="582" y="466" width="48" height="22" rx="11" fill="#DCF2E5"/>
  <text x="606" y="481" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#0E7C5B" letter-spacing="0.5">IC</text>

  <text x="500" y="514" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#8A93A2">or</text>
  <text x="530" y="514" font-family="'Instrument Serif',Georgia,serif" font-size="18" fill="#0E7C5B">Neptune ♆</text>
  <rect x="630" y="500" width="46" height="20" rx="10" fill="#DCF2E5"/>
  <text x="653" y="514" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" fill="#0E7C5B" letter-spacing="0.5">IC</text>

  <line x1="60" y1="528" x2="760" y2="528" stroke="#E7E0D1" stroke-width="1"/>

  <!-- ── PRIMARY ROW 4: Reinvention ── -->
  <rect x="60" y="530" width="700" height="76" rx="0" fill="#0B1118"/>
  <text x="84" y="564" font-family="'Instrument Serif',Georgia,serif" font-size="26" font-style="italic" fill="#EAF2EE">Total reinvention</text>
  <text x="84" y="590" font-size="13" fill="#8A93A2">"Burn the old self."</text>

  <text x="500" y="564" font-family="'Instrument Serif',Georgia,serif" font-size="22" fill="#B2543F">Pluto ♇</text>
  <rect x="566" y="546" width="72" height="22" rx="11" fill="#1f1426"/>
  <text x="602" y="561" font-family="'JetBrains Mono',monospace" font-size="11" text-anchor="middle" fill="#B2543F" letter-spacing="0.5">any angle</text>

  <text x="500" y="594" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="15" fill="#8A93A2">or</text>
  <text x="530" y="594" font-family="'Instrument Serif',Georgia,serif" font-size="18" fill="#B2543F">Uranus ♅</text>
  <rect x="624" y="580" width="46" height="20" rx="10" fill="#1f1426"/>
  <text x="647" y="594" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" fill="#B2543F" letter-spacing="0.5">AC</text>

  <!-- ── SECONDARY SECTION HEADER ── -->
  <text x="60" y="650" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#8A93A2" letter-spacing="2.5">FOUR SECONDARY GOALS</text>
  <text x="760" y="650" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#8A93A2" letter-spacing="2.5" text-anchor="end">SINGLE LINE EACH</text>
  <line x1="60" y1="660" x2="760" y2="660" stroke="#DDD5C2" stroke-width="1"/>

  <!-- Secondary 2x2 grid -->
  <g>
    <rect x="60" y="676" width="345" height="62" rx="0" fill="#FFFFFF"/>
    <text x="84" y="704" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="19" fill="#181C23">Communication &amp; writing</text>
    <text x="84" y="726" font-family="'Instrument Serif',Georgia,serif" font-size="16" fill="#0E7C5B">Mercury ☿</text>
    <rect x="180" y="713" width="76" height="20" rx="10" fill="#DCF2E5"/>
    <text x="218" y="727" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" fill="#0E7C5B" letter-spacing="0.5">MC / AC</text>
  </g>

  <g>
    <rect x="415" y="676" width="345" height="62" rx="0" fill="#FFFFFF"/>
    <text x="439" y="704" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="19" fill="#181C23">Drive &amp; founding</text>
    <text x="439" y="726" font-family="'Instrument Serif',Georgia,serif" font-size="16" fill="#B2543F">Mars ♂</text>
    <rect x="500" y="713" width="48" height="20" rx="10" fill="#F9E3E0"/>
    <text x="524" y="727" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" fill="#B2543F" letter-spacing="0.5">MC</text>
  </g>

  <g>
    <rect x="60" y="742" width="345" height="62" rx="0" fill="#FBF8F1"/>
    <text x="84" y="770" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="19" fill="#181C23">Mastery &amp; discipline</text>
    <text x="84" y="792" font-family="'Instrument Serif',Georgia,serif" font-size="16" fill="#4C5563">Saturn ♄</text>
    <rect x="156" y="779" width="48" height="20" rx="10" fill="#F4EFE3"/>
    <text x="180" y="793" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" fill="#4C5563" letter-spacing="0.5">MC</text>
  </g>

  <g>
    <rect x="415" y="742" width="345" height="62" rx="0" fill="#FBF8F1"/>
    <text x="439" y="770" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="19" fill="#181C23">Abundance &amp; expansion</text>
    <text x="439" y="792" font-family="'Instrument Serif',Georgia,serif" font-size="16" fill="#A8650F">Jupiter ♃</text>
    <rect x="529" y="779" width="48" height="20" rx="10" fill="#FAEBD2"/>
    <text x="553" y="793" font-family="'JetBrains Mono',monospace" font-size="10" text-anchor="middle" fill="#A8650F" letter-spacing="0.5">MC</text>
  </g>

  <line x1="60" y1="806" x2="760" y2="806" stroke="#DDD5C2" stroke-width="1"/>

  <!-- ── FOOTER QUOTE ── -->
  <text x="410" y="848" font-family="'Instrument Serif',Georgia,serif" font-style="italic" font-size="18" fill="#4C5563" text-anchor="middle">
    "The lines amplify. They do not transform."
  </text>
  <text x="410" y="868" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8A93A2" text-anchor="middle" letter-spacing="2">— APOLLO'S WARNING</text>
</svg>
