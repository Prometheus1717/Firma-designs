<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gr" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="gc"><circle cx="235" cy="315" r="180"/></clipPath>

    <!-- Subtle star dots -->
    <filter id="star" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A1018"/>

  <!-- Subtle background stars -->
  <g opacity="0.3" filter="url(#star)">
    <circle cx="80" cy="60" r="1.2" fill="#C8D8E8"/>
    <circle cx="550" cy="45" r="1" fill="#C8D8E8"/>
    <circle cx="780" cy="80" r="0.8" fill="#C8D8E8"/>
    <circle cx="950" cy="55" r="1.1" fill="#C8D8E8"/>
    <circle cx="1100" cy="90" r="0.9" fill="#C8D8E8"/>
    <circle cx="650" cy="560" r="1" fill="#C8D8E8"/>
    <circle cx="900" cy="520" r="0.8" fill="#C8D8E8"/>
    <circle cx="1050" cy="580" r="1.2" fill="#C8D8E8"/>
    <circle cx="120" cy="540" r="0.7" fill="#C8D8E8"/>
    <circle cx="700" cy="280" r="0.6" fill="#C8D8E8"/>
    <circle cx="1140" cy="300" r="0.9" fill="#C8D8E8"/>
    <circle cx="820" cy="420" r="0.7" fill="#C8D8E8"/>
  </g>

  <!-- ════════ LOGO (left side, centered at 235,315) ════════ -->

  <!-- Back ring -->
  <path d="M 416,186 A 221,59 -35 0 1 54,444"
        stroke="#E8A838" stroke-width="4.5" fill="none" filter="url(#gr)" opacity="0.8"/>

  <!-- Globe fill -->
  <circle cx="235" cy="315" r="180" fill="#0A1018"/>

  <!-- Globe grid -->
  <g clip-path="url(#gc)" filter="url(#g)">
    <circle cx="235" cy="315" r="178" stroke="#00D88A" stroke-width="3" fill="none"/>
    <!-- Latitudes -->
    <line x1="30" y1="315" x2="440" y2="315" stroke="#00D88A" stroke-width="1.8"/>
    <line x1="30" y1="225" x2="440" y2="225" stroke="#00D88A" stroke-width="1.5"/>
    <line x1="30" y1="405" x2="440" y2="405" stroke="#00D88A" stroke-width="1.5"/>
    <line x1="30" y1="158" x2="440" y2="158" stroke="#00D88A" stroke-width="1.2"/>
    <line x1="30" y1="472" x2="440" y2="472" stroke="#00D88A" stroke-width="1.2"/>
    <!-- Central meridian -->
    <line x1="235" y1="133" x2="235" y2="497" stroke="#00D88A" stroke-width="1.8"/>
    <!-- Meridians -->
    <ellipse cx="235" cy="315" rx="62" ry="178" stroke="#00D88A" stroke-width="1.5" fill="none"/>
    <ellipse cx="235" cy="315" rx="116" ry="178" stroke="#00D88A" stroke-width="1.5" fill="none"/>
    <ellipse cx="235" cy="315" rx="162" ry="178" stroke="#00D88A" stroke-width="1.2" fill="none"/>
  </g>

  <!-- NN Monogram -->
  <path d="M 140,410
           L 140,266
           C 140,238  176,233  196,294
           L 235,410
           L 235,266
           C 235,238  271,233  292,294
           L 330,410
           L 330,235"
        stroke="#00D88A" stroke-width="11" fill="none"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#gn)"/>

  <!-- Front ring -->
  <path d="M 54,444 A 221,59 -35 0 1 416,186"
        stroke="#E8A838" stroke-width="4.5" fill="none" filter="url(#gr)"/>

  <!-- ════════ TEXT (right side) ════════ -->

  <!-- Title -->
  <text x="500" y="235" fill="#00D88A" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace" font-size="42" font-weight="700" letter-spacing="6">NATAL NAVIGATOR</text>

  <!-- Divider line -->
  <line x1="500" y1="262" x2="820" y2="262" stroke="#00D88A" stroke-width="1.5" opacity="0.4"/>

  <!-- Subtitle -->
  <text x="500" y="310" fill="#C8D8E8" font-family="'Instrument Sans', 'Inter', system-ui, sans-serif" font-size="26" font-weight="400">Find Where Your Stars Align</text>

  <!-- Feature bullets -->
  <g fill="#7A8FA8" font-family="'Instrument Sans', 'Inter', system-ui, sans-serif" font-size="17">
    <text x="500" y="380">
      <tspan fill="#E8A838">&#9679;</tspan> Interactive 3D Astrocartography Globe
    </text>
    <text x="500" y="412">
      <tspan fill="#E8A838">&#9679;</tspan> 10 Planets · 4 Angles · 40 Lines
    </text>
    <text x="500" y="444">
      <tspan fill="#E8A838">&#9679;</tspan> Personalized Natal Chart &amp; City Detection
    </text>
  </g>

  <!-- URL -->
  <text x="500" y="530" fill="#3A5068" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="500" letter-spacing="2">natalnavigator.com</text>
</svg>
