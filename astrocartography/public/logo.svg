<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Neon glow for green elements -->
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Stronger glow for NN monogram -->
    <filter id="gn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Warm glow for orange ring -->
    <filter id="gr" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip grid to globe interior -->
    <clipPath id="gc">
      <circle cx="500" cy="500" r="350"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="#0A1018"/>

  <!-- ═══ LAYER 1: Back half of orbital ring (behind globe) ═══ -->
  <path d="M 852,253 A 430,115 -35 0 1 148,747"
        stroke="#E8A838" stroke-width="8" fill="none" filter="url(#gr)" opacity="0.85"/>

  <!-- ═══ LAYER 2: Globe opaque fill (occludes back ring inside globe) ═══ -->
  <circle cx="500" cy="500" r="350" fill="#0A1018"/>

  <!-- ═══ LAYER 3: Globe wireframe grid ═══ -->
  <g clip-path="url(#gc)" filter="url(#g)">
    <!-- Globe outline -->
    <circle cx="500" cy="500" r="348" stroke="#00D88A" stroke-width="5" fill="none"/>

    <!-- Equator -->
    <line x1="100" y1="500" x2="900" y2="500" stroke="#00D88A" stroke-width="3"/>
    <!-- 30° N/S -->
    <line x1="100" y1="325" x2="900" y2="325" stroke="#00D88A" stroke-width="2.5"/>
    <line x1="100" y1="675" x2="900" y2="675" stroke="#00D88A" stroke-width="2.5"/>
    <!-- 60° N/S -->
    <line x1="100" y1="195" x2="900" y2="195" stroke="#00D88A" stroke-width="2"/>
    <line x1="100" y1="805" x2="900" y2="805" stroke="#00D88A" stroke-width="2"/>

    <!-- Central meridian (0°) -->
    <line x1="500" y1="148" x2="500" y2="852" stroke="#00D88A" stroke-width="3"/>
    <!-- ±20° meridians -->
    <ellipse cx="500" cy="500" rx="120" ry="348" stroke="#00D88A" stroke-width="2.5" fill="none"/>
    <!-- ±40° meridians -->
    <ellipse cx="500" cy="500" rx="225" ry="348" stroke="#00D88A" stroke-width="2.5" fill="none"/>
    <!-- ±65° meridians -->
    <ellipse cx="500" cy="500" rx="316" ry="348" stroke="#00D88A" stroke-width="2" fill="none"/>
  </g>

  <!-- ═══ LAYER 4: NN Monogram ═══ -->
  <!--
    Two connected N letterforms drawn as a single continuous stroke path.
    Each N: vertical stroke → smooth arch at top → diagonal stroke down.
    The arch uses cubic beziers with matched tangent directions for G1 continuity.
    The shared center stroke connects both N's cleanly at the baseline.
  -->
  <path d="M 315,685
           L 315,405
           C 315,350  385,340  425,460
           L 500,685
           L 500,405
           C 500,350  570,340  610,460
           L 685,685
           L 685,345"
        stroke="#00D88A" stroke-width="22" fill="none"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#gn)"/>

  <!-- ═══ LAYER 5: Front half of orbital ring (over globe) ═══ -->
  <path d="M 148,747 A 430,115 -35 0 1 852,253"
        stroke="#E8A838" stroke-width="8" fill="none" filter="url(#gr)"/>
</svg>
