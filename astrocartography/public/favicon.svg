<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="gc"><circle cx="50" cy="50" r="35"/></clipPath>
  </defs>

  <rect width="100" height="100" fill="#0A1018" rx="18"/>

  <!-- Back ring -->
  <path d="M 85.2,25.3 A 43,11.5 -35 0 1 14.8,74.7" stroke="#E8A838" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Globe fill -->
  <circle cx="50" cy="50" r="35" fill="#0A1018"/>

  <!-- Globe grid -->
  <g clip-path="url(#gc)">
    <circle cx="50" cy="50" r="34.5" stroke="#00D88A" stroke-width="1.8" fill="none"/>
    <line x1="10" y1="50" x2="90" y2="50" stroke="#00D88A" stroke-width="1"/>
    <line x1="10" y1="33" x2="90" y2="33" stroke="#00D88A" stroke-width="0.8"/>
    <line x1="10" y1="67" x2="90" y2="67" stroke="#00D88A" stroke-width="0.8"/>
    <line x1="50" y1="15" x2="50" y2="85" stroke="#00D88A" stroke-width="1"/>
    <ellipse cx="50" cy="50" rx="12" ry="34.5" stroke="#00D88A" stroke-width="0.8" fill="none"/>
    <ellipse cx="50" cy="50" rx="24" ry="34.5" stroke="#00D88A" stroke-width="0.8" fill="none"/>
  </g>

  <!-- NN Monogram -->
  <path d="M 31.5,68.5 L 31.5,40.5 C 31.5,35 38.5,34 42.5,46 L 50,68.5 L 50,40.5 C 50,35 57,34 61,46 L 68.5,68.5 L 68.5,34.5"
        stroke="#00D88A" stroke-width="4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front ring -->
  <path d="M 14.8,74.7 A 43,11.5 -35 0 1 85.2,25.3" stroke="#E8A838" stroke-width="2" fill="none"/>
</svg>
