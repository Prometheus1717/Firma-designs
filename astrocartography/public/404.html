    .code { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 3px; color: var(--mint); text-transform: uppercase; }
    h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 6vw, 52px); line-height: 1.12; margin: 14px 0 16px; }
    p { color: var(--ink2); font-size: 17px; margin: 0 0 30px; }
    .btn { display: inline-flex; align-items: center; gap: 9px; padding: 14px 26px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 15px; text-decoration: none; }
    .links { margin-top: 44px; padding-top: 28px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: center; }
    .links a { color: var(--ink2); font-size: 14px; text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; }
    .links a:hover { color: var(--mint); border-color: var(--mint); }
  </style>
</head>
